<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法門深造｜政大太極社</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓四個頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // 關閉 preflight（Tailwind 的預設樣式重置），避免影響本頁原本手寫的 CSS
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        ink: { deep: '#08090A', dark: '#111315', card: '#181B1E' },
                        cloud: '#8E95A0',
                        pine: { light: '#427A5B', DEFAULT: '#1E3D2F', dark: '#0F2118' },
                        bronze: { light: '#D9C39E', DEFAULT: '#B89742', dark: '#8C6C30' }
                    },
                    fontFamily: { serif: ['Noto Serif TC', 'serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --玄色: #121212; --霧霾灰: #A0A0A0; --松柏綠: #5C9A6C; /* 將綠色稍微調亮，增加對比度 */ --古銅金: #C5A059; --仙氣白: #E5E5E5;
        }
        body { background-color: var(--玄色); color: var(--仙氣白); font-family: 'Noto Serif TC', serif; margin: 0; line-by-line: 1.8; }
        .container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        h1 { color: var(--古銅金); text-align: center; letter-spacing: 4px; font-size: 2.2rem; }
        .subtitle { text-align: center; color: var(--霧霾灰); font-style: italic; margin-bottom: 60px; font-size: 0.95rem; }

        .gongfa-detail {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 修復後的標題樣式 */
        .gongfa-detail h2 {
            color: var(--松柏綠);
            background-color: rgba(160, 160, 160, 0.15); /* 霧霾灰底框 */
            display: inline-block; /* 讓框隨文字長度縮放 */
            padding: 10px 18px; /* 內部留白 */
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid var(--古銅金);
            border-right: 4px solid var(--古銅金);
        }

        /* 內文段落間距：文字現在會被自動包成一段一段的 <p>，這裡統一控制段落間的留白 */
        .gongfa-text p {
            margin: 0 0 16px 0;
        }
        .gongfa-text p:last-child {
            margin-bottom: 0;
        }

        /* 影片預留區樣式 */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #1A1A1A; border: 1px solid #333; }
        .video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--霧霾灰); }
        .video-placeholder i { font-size: 2rem; margin-bottom: 10px; color: var(--古銅金); }
    </style>
</head>
<body>

    <!-- 整合版：頂部道門天際導覽（含手機版漢堡選單），與首頁共用同一套設計 -->
    <header class="sticky top-0 left-0 w-full z-50 bg-ink-deep/90 backdrop-blur-md border-b border-white/5 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center relative">

            <!-- 左側：道場牌匾 -->
            <a href="index.html" class="text-xl font-bold tracking-widest text-bronze-light flex items-center gap-2 transition-colors duration-300 hover:text-white">
                <span id="nav-badge" class="text-xs border border-bronze px-1.5 py-0.5 rounded">政大</span>
                <span id="nav-brand">太極社</span> <span id="nav-brand-sub" class="font-light text-sm text-cloud/70">| 隱逸道場</span>
            </a>

            <!-- 右側：電腦版跨頁導覽連結 -->
            <nav class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="nav-link-home text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">首頁主殿</a>
                <a href="gongfa.html" class="nav-link-method text-sm tracking-widest text-bronze-light font-bold">法門深造</a>
                <a href="activities.html" class="nav-link-activities text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">活動介紹</a>
                <a href="calendar.html" class="nav-link-calendar text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">修煉日程</a>
            </nav>

            <!-- 右側：手機版漢堡選單按鈕 -->
            <button id="mobile-menu-btn" class="md:hidden text-bronze-light hover:text-white focus:outline-none transition-colors">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- 手機版下拉選單區塊 -->
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-ink-deep/95 backdrop-blur-lg border-b border-white/10 flex-col items-center py-6 space-y-6 shadow-2xl transition-all duration-300 z-40">
            <a href="index.html" class="nav-link-home text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">首頁主殿</a>
            <a href="gongfa.html" class="nav-link-method text-sm tracking-widest text-bronze-light font-bold w-full text-center block">法門深造</a>
            <a href="activities.html" class="nav-link-activities text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">活動介紹</a>
            <a href="calendar.html" class="nav-link-calendar text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">修煉日程</a>
        </nav>
    </header>

    <!-- 手機版選單開關腳本 -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
    </script>

    <div class="container">
        <h1 id="page-title">四大法門深探</h1>
        <div class="subtitle" id="page-subtitle">「由淺入深，由動入靜。此處記載本門核心武學之微言大義與演武示範。」</div>

       <!-- 動態功法載入區塊 -->
        <div id="gongfa-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱藏經閣，載入法門中...</div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            function setText(id, value) {
                const el = document.getElementById(id);
                if (el && value !== undefined && value !== null) el.innerText = value;
            }
            function setTextAll(className, value) {
                if (value === undefined || value === null) return;
                document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
            }

            // 把後台填的「純文字」自動轉成一段一段的 <p>：
            // 空一行 = 分段；段落內單純換行 = 換行(<br>)。
            // 這樣後台不用寫任何 HTML 標籤，打字習慣照打就好。
            function paragraphize(text) {
                if (!text) return '';
                return text
                    .split(/\n\s*\n/)
                    .map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`)
                    .join('');
            }

            // 從各種常見的 YouTube 網址格式（分享連結、短網址、embed 連結）擷取出影片 ID
            function extractYouTubeId(url) {
                if (!url) return null;
                const patterns = [
                    /youtube\.com\/watch\?v=([\w-]{11})/,
                    /youtu\.be\/([\w-]{11})/,
                    /youtube\.com\/embed\/([\w-]{11})/
                ];
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            // 導覽列文字與品牌角標：讀取 data/home.json 的 nav 設定，跟首頁與其他子頁共用同一份資料
            // 網址後面加上 ?v=時間戳記，避免瀏覽器用快取的舊資料
            fetch('data/home.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (!data.nav) return;
                    setText('nav-badge', data.nav.badge);
                    setText('nav-brand', data.nav.brand);
                    if (data.nav.brand_sub) setText('nav-brand-sub', '| ' + data.nav.brand_sub);
                    setTextAll('nav-link-home', data.nav.link_home);
                    setTextAll('nav-link-method', data.nav.link_method);
                    setTextAll('nav-link-activities', data.nav.link_activities);
                    setTextAll('nav-link-calendar', data.nav.link_calendar);
                })
                .catch(error => console.error('讀取 data/home.json 失敗：', error));

            // 本頁主要內容：讀取 data/gongfa.json
            // 網址後面加上 ?v=時間戳記，避免瀏覽器用快取的舊資料
            fetch('data/gongfa.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('gongfa-container');
                    container.innerHTML = '';

                    (data.methods || []).forEach(method => {
                        const videoId = extractYouTubeId(method.video_url);
                        const videoContent = videoId
                            ? `<iframe src="https://www.youtube.com/embed/${videoId}" title="${method.title}"
                                   style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
                                   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                   allowfullscreen></iframe>`
                            : `<div class="video-placeholder">
                                   <span>☯️ 功法招式演練．影像準備中 ☯️</span>
                               </div>`;

                        const methodHTML = `
                            <div class="gongfa-detail">
                                <h2>${method.title}</h2>
                                <div class="gongfa-text">${paragraphize(method.desc)}</div>
                                <div class="video-container">
                                    ${videoContent}
                                </div>
                            </div>
                        `;
                        container.innerHTML += methodHTML;
                    });
                })
                .catch(error => {
                    document.getElementById('gongfa-container').innerHTML = '<div style="text-align:center; color:red;">藏經閣大門深鎖，載入失敗。</div>';
                });
        </script>

    </div>

</body>
</html>
