<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法門深造｜政大太極社</title>
    <meta name="description" content="政大太極社四大法門深探：華陀導引氣功、太極拳、太祖棍、太極劍，詳細介紹各項功法的內涵與修煉方式。">
    <link rel="canonical" href="https://nccutaichiclub.github.io/Taichi-club-website/gongfa.html">

    <!-- Open Graph 標籤：讓 LINE／FB／IG 分享連結時顯示漂亮的預覽卡片 -->
    <meta property="og:title" content="法門深造｜政大太極社">
    <meta property="og:description" content="政大太極社四大法門深探：華陀導引氣功、太極拳、太祖棍、太極劍，詳細介紹各項功法的內涵與修煉方式。">
    <meta property="og:url" content="https://nccutaichiclub.github.io/Taichi-club-website/gongfa.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">

    <!-- 引入思源宋體，跟首頁共用同一套字重設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config-sub.js"></script>

    <!-- 四個子頁共用的基礎樣式 -->
    <link rel="stylesheet" href="css/base.css">

    <style>
        /* 本頁專屬的樣式覆蓋：容器寬度比其他子頁窄一點 */
        .container {
            max-width: 800px;
        }

        .gongfa-detail {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 手機版：拿掉外框、底色與大內距，讓文字不那麼擁擠 */
        @media (max-width: 767px) {
            .gongfa-detail {
                background-color: transparent;
                border: none;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                margin-bottom: 48px;
            }
        }

        /* 法門標題樣式 */
        .gongfa-detail h2 {
            color: var(--松柏綠);
            background-color: rgba(160, 160, 160, 0.15);
            display: inline-block;
            padding: 10px 18px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid var(--古銅金);
            border-right: 4px solid var(--古銅金);
        }

        /* 手機版：法門標題字級縮小、行距加大 */
        @media (max-width: 767px) {
            .gongfa-detail h2 {
                font-size: 1.25rem;
                line-height: 1.4;
            }
        }

        /*
         * 內文段落間距
         * 手機版原本曾縮小至 0.875rem，
         * 現恢復為原本的 1rem。
         */
        .gongfa-text p,
        .plain-translation-text p {
            font-size: 1rem;
            margin: 0 0 16px 0;
        }

        .gongfa-text p:last-child,
        .plain-translation-text p:last-child {
            margin-bottom: 0;
        }

        /* 白話翻譯：與首頁「查看更多」統一為古銅金粗體，並增加與內文的視覺距離；負 margin 抵銷高度變化 */
        .plain-translation-toggle-wrap {
            margin-top: 16px;
            margin-bottom: -12px;
            text-align: right;
        }

        .plain-translation-toggle {
            border: 0;
            background: transparent;
            padding: 0;
            font-family: inherit;
            font-size: 0.75rem;
            color: #B89742;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .plain-translation-toggle:hover {
            color: #fff;
        }

        .plain-translation {
            display: none;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid rgba(184, 151, 66, 0.35);
        }

        .plain-translation.is-open {
            display: block;
        }

        .plain-translation-title {
            margin: 0 0 14px 0;
            color: #B89742;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <!-- 全站共用的語言切換邏輯，要在其他腳本之前載入 -->
    <script src="js/lang.js"></script>

    <!-- 頁面載入遮罩 -->
    <div id="page-loading-overlay"
         style="position:fixed;inset:0;background:#121212;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
        <div id="page-loading-text"
             style="color:#C5A059;font-family:'Noto Serif TC',serif;letter-spacing:4px;font-size:0.9rem;">
            道場開啟中...
        </div>
    </div>

    <script>
        (function() {
            // 立刻套用上次快取的「道場開啟中」文字
            var cached = (typeof getCachedLoadingText === 'function')
                ? getCachedLoadingText()
                : null;

            if (cached) {
                document.getElementById('page-loading-text').innerText = cached;
            }
        })();
    </script>

    <!-- 頂部導覽列：由 header.js 統一產生 -->
    <div id="site-header"></div>
    <script src="js/header.js"></script>

    <div class="container">

        <h1 id="page-title">四大法門深探</h1>

        <div class="subtitle" id="page-subtitle">
            「由淺入深，由動入靜。此處記載本門核心武學之微言大義與演武示範。」
        </div>

        <!-- 動態功法載入區塊 -->
        <div id="gongfa-container">
            <div style="text-align:center; color:var(--霧霾灰);">
                正在翻閱藏經閣，載入法門中...
            </div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            // 本頁主要內容：讀取 data/gongfa.json
            // 網址後面加上 ?v=時間戳記，避免瀏覽器使用快取的舊資料
            fetch('data/gongfa.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {

                    data = applyLangToData(data);

                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }

                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('gongfa-container');
                    container.innerHTML = '';

                    const isEnglish = getLang() === 'en';
                    const toggleOpenText = isEnglish ? 'View Plain-Language Translation' : '查看白話翻譯';
                    const toggleCloseText = isEnglish ? 'Hide Plain-Language Translation' : '收起白話翻譯';
                    const translationTitle = isEnglish ? 'Plain-Language Translation' : '白話翻譯';

                    (data.methods || []).forEach((method, index) => {

                        const hasPlainTranslation = method.plain_desc && method.plain_desc.trim() !== '';
                        const translationId = 'plain-translation-' + index;

                        const methodHTML = `
                            <div class="gongfa-detail">
                                <h2>${method.title}</h2>
                                <div class="gongfa-text">
                                    ${paragraphize(method.desc)}
                                </div>
                                ${hasPlainTranslation ? `
                                    <div class="plain-translation-toggle-wrap">
                                        <button
                                            type="button"
                                            class="plain-translation-toggle"
                                            aria-expanded="false"
                                            aria-controls="${translationId}"
                                        >${toggleOpenText}</button>
                                    </div>
                                    <div id="${translationId}" class="plain-translation">
                                        <div class="plain-translation-title">${translationTitle}</div>
                                        <div class="plain-translation-text">
                                            ${paragraphize(method.plain_desc)}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `;

                        container.innerHTML += methodHTML;
                    });

                    container.querySelectorAll('.plain-translation-toggle').forEach(button => {
                        button.addEventListener('click', () => {
                            const translation = document.getElementById(button.getAttribute('aria-controls'));
                            if (!translation) return;

                            const isOpen = translation.classList.toggle('is-open');
                            button.setAttribute('aria-expanded', String(isOpen));
                            button.innerText = isOpen ? toggleCloseText : toggleOpenText;
                        });
                    });

                    hidePageLoadingOverlay();
                })
                .catch(error => {

                    document.getElementById('gongfa-container').innerHTML =
                        '<div style="text-align:center; color:red;">藏經閣大門深鎖，載入失敗。</div>';

                    hidePageLoadingOverlay();
                });
        </script>

    </div>

</body>
</html>
