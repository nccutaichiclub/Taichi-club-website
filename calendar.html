<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修煉日程｜政大太極社</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓四個頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // 關閉 preflight（Tailwind 的預設樣式重置），避免影響本頁原本手寫的 CSS
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        ink: { deep: '#08090A', dark: '#111315', card: '#181B1E' },
                        cloud: '#8E95A0',
                        pine: { light: '#427A5B', DEFAULT: '#1E3D2F', dark: '#0F2118' },
                        bronze: { light: '#D9C39E', DEFAULT: '#B89742', dark: '#8C6C30' }
                    },
                    fontFamily: { serif: ['Noto Serif TC', 'serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --玄色: #121212; --霧霾灰: #A0A0A0; --松柏綠: #1C3A27; --古銅金: #C5A059; --仙氣白: #E5E5E5;
        }
        body { background-color: var(--玄色); color: var(--仙氣白); font-family: 'Noto Serif TC', serif; margin: 0; line-height: 1.8; }
        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        h1 { color: var(--古銅金); text-align: center; letter-spacing: 4px; font-size: 2.2rem; margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--霧霾灰); font-style: italic; margin-bottom: 50px; font-size: 0.95rem; }

        /* 本學期行事曆：中英雙語並排小圖預覽區塊 */
        .semester-schedule {
            margin-bottom: 50px;
        }
        .semester-schedule-title {
            text-align: center;
            color: var(--仙氣白);
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        /* 桌面版固定兩欄並排；手機版（螢幕寬度不足時）自動改成單欄堆疊 */
        .semester-schedule-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 640px) {
            .semester-schedule-grid {
                grid-template-columns: 1fr;
            }
        }
        .schedule-card {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .schedule-card-label {
            color: var(--古銅金);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        /* 小圖預覽：固定比例，不需要捲動頁面即可同時看到兩張 */
        .schedule-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2A2A2A;
            cursor: zoom-in;
            background: #0E0E0E;
        }
        .schedule-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.35s ease;
        }
        .schedule-thumb-wrap:hover img {
            transform: scale(1.04);
        }
        .schedule-thumb-hint {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
            color: var(--仙氣白);
            font-size: 0.7rem;
            padding: 18px 6px 6px;
            letter-spacing: 1px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 14px;
            padding: 8px 20px;
            background-color: var(--古銅金);
            color: #121212;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 2px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: opacity 0.3s;
        }
        .download-btn:hover {
            opacity: 0.85;
        }

        /* 燈箱（Lightbox）：點縮圖後全螢幕顯示大圖 */
        .lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 30px;
            cursor: zoom-out;
        }
        .lightbox-overlay.active {
            display: flex;
        }
        .lightbox-overlay img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--仙氣白);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            background: none;
            border: none;
        }
        .lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--古銅金);
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        /* 曆法表格樣式 */
        /* 三層行事曆結構樣式：學期(獨立金字直角框) → 月份/例行活動(金底深字標題，更醒目) → 活動(透明底白字，與標題相連) */
        .semester-badge {
            display: inline-block;
            background-color: var(--松柏綠);
            color: var(--古銅金);
            font-weight: 700;
            letter-spacing: 2px;
            padding: 8px 18px;
            border-radius: 0; /* 直角邊框 */
            border: 1px solid rgba(197, 160, 89, 0.4);
            font-size: 0.95rem;
            margin-bottom: 28px; /* 與下方月份標題拉開間距 */
        }
        .month-block {
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.35);
            margin-bottom: 16px;
        }
        .month-header {
            /* 改用金色底＋深色字，跟下方透明底的活動列形成清楚的明暗對比，更醒目易讀 */
            background-color: var(--古銅金);
            color: #14140F;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 10px 18px;
            font-size: 0.95rem;
        }
        .event-row {
            background-color: transparent;
            color: var(--仙氣白);
            padding: 14px 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .event-row:first-child {
            border-top: none;
        }
        .event-row .event-title-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .event-row .event-meta-line {
            color: var(--霧霾灰);
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .event-row .event-detail {
            color: var(--霧霾灰);
            font-size: 0.82rem;
            margin-top: 6px;
        }
        .event-row .event-note {
            /* 停課/活動異動提醒：用不刺眼的暖紅色，醒目但不會讓人不適 */
            color: #E2725B;
            font-weight: 600;
            font-size: 0.82rem;
            margin-top: 8px;
        }
        .semester-group {
            margin-bottom: 40px;
        }
        .semester-group:last-child {
            margin-bottom: 0;
        }

        /* 加入 Google 日曆按鈕 */
        .gcal-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 5px 12px;
            font-size: 0.75rem;
            color: var(--古銅金);
            border: 1px solid var(--古銅金);
            border-radius: 20px;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.3s, color 0.3s;
        }
        .gcal-btn:hover {
            background-color: var(--古銅金);
            color: #121212;
        }

        /* 手機版漢堡選單按鈕：因子頁關閉了 Tailwind 的 preflight，瀏覽器預設的按鈕框線/背景會跑出來，這裡手動重置 */
        #mobile-menu-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 整合版：頂部道門天際導覽（含手機版漢堡選單），與首頁共用同一套設計 -->

        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center relative">

    <!-- 手機版選單開關腳本 -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
    </script>

    <div class="container">
        <h1>四時曆法</h1>
        <div class="subtitle">「順應天時，不期而遇。此乃本門弟子紅塵與山林修煉之引導。」</div>

        <!-- 本學期行事曆：中英雙語並排小圖預覽，由後台資料決定顯示筆數與內容 -->
        <div id="semester-schedule" class="semester-schedule" style="display:none;">
            <div id="semester-schedule-title" class="semester-schedule-title" style="display:none;"></div>
            <div id="semester-schedule-grid" class="semester-schedule-grid"></div>
        </div>

        <!-- 燈箱：點擊小圖後在此全螢幕顯示大圖 -->
        <div id="lightbox-overlay" class="lightbox-overlay">
            <button class="lightbox-close" id="lightbox-close" aria-label="關閉">&times;</button>
            <img id="lightbox-image" src="" alt="">
            <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>

        <div id="calendar-events-container">
            <!-- 這裡的內容將由 JavaScript 自動從後台資料庫載入，依「學期 → 月份 → 活動」三層結構呈現 -->
            <p style="text-align:center; color:#A0A0A0;">正在感應天時，載入曆法中...</p>
        </div>

        <!-- 圖片路徑防呆：本網站放在 .../Taichi-club-website/ 這個子路徑下，
             如果圖片/檔案路徑意外帶了開頭的 "/"，這裡統一拿掉，改成正確的相對路徑 -->
        <script>
            function resolveImagePath(path) {
                if (!path) return '';
                return path.replace(/^\/+/, '');
            }
            function setText(id, value) {
                const el = document.getElementById(id);
                if (el && value !== undefined && value !== null) el.innerText = value;
            }
            function setTextAll(className, value) {
                if (value === undefined || value === null) return;
                document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
            }

            // 組出「一鍵加入 Google 日曆」的網址：需要活動有填「起始日期」跟「開始時間」才會產生
            function buildGoogleCalendarUrl(event) {
                if (!event.event_date || !event.start_time) return null;

                const dateStr = event.event_date.slice(0, 10).replace(/-/g, ''); // 取前10碼 "2026-09-08" -> "20260908"，避免完整時間字串影響
                const startStr = event.start_time.replace(':', '') + '00';
                const endStr = (event.end_time || event.start_time).replace(':', '') + '00';
                const dates = `${dateStr}T${startStr}/${dateStr}T${endStr}`;

                const params = new URLSearchParams({
                    action: 'TEMPLATE',
                    text: event.title || '',
                    dates: dates,
                    details: event.desc || '',
                    location: event.location || '',
                    ctz: 'Asia/Taipei'
                });

                if (event.repeat === 'weekly' || event.repeat === 'biweekly') {
                    let rrule = event.repeat === 'weekly' ? 'RRULE:FREQ=WEEKLY' : 'RRULE:FREQ=WEEKLY;INTERVAL=2';
                    // 有設定「重複結束日期」就加上 UNTIL，讓重複活動到那天為止就停止，不會無限重複下去
                    if (event.repeat_until) {
                        const untilStr = event.repeat_until.slice(0, 10).replace(/-/g, '');
                        rrule += `;UNTIL=${untilStr}T235959Z`;
                    }
                    params.set('recur', rrule);
                }

                return `https://www.google.com/calendar/render?${params.toString()}`;
            }

            // 月份數字轉中文標題，例如 9 -> 「九月份活動」；recurring 則顯示「例行活動」
            const CHINESE_MONTH = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
            function monthLabel(monthValue) {
                if (monthValue === 'recurring') return '例行活動';
                const n = parseInt(monthValue, 10);
                if (!n || n < 1 || n > 12) return '未分類月份活動';
                return `${CHINESE_MONTH[n]}月份活動`;
            }

            // 三層行事曆渲染：最上方是單一的學期標題（一次只會有一個學期在使用），
            // 底下依「月份／例行活動」分組，維持後台輸入的先後順序
            function renderScheduleEvents(semesterTitle, events) {
                const container = document.getElementById('calendar-events-container');
                if (!container) return;
                container.innerHTML = '';
                if (!Array.isArray(events) || events.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#A0A0A0;">目前尚無行事曆活動。</p>';
                    return;
                }

                const semesterGroup = document.createElement('div');
                semesterGroup.className = 'semester-group';

                // 第一層：學期，綠底金字、直角獨立框框
                const badge = document.createElement('div');
                badge.className = 'semester-badge';
                badge.innerText = (semesterTitle && semesterTitle.trim() !== '') ? `${semesterTitle.trim()} 學期行事曆` : '學期行事曆';
                semesterGroup.appendChild(badge);

                // 依「月份／例行活動」分組，維持後台輸入的先後順序
                const groupOrder = [];
                const groupMap = {};
                events.forEach(ev => {
                    const key = (ev.month !== undefined && ev.month !== null && ev.month !== '') ? String(ev.month) : '未分類';
                    if (!groupMap[key]) {
                        groupMap[key] = [];
                        groupOrder.push(key);
                    }
                    groupMap[key].push(ev);
                });

                groupOrder.forEach(key => {
                    // 第二層：月份或例行活動，金底深字標題，跟底下的活動列相連成一個區塊
                    const monthBlock = document.createElement('div');
                    monthBlock.className = 'month-block';

                    const monthHeader = document.createElement('div');
                    monthHeader.className = 'month-header';
                    monthHeader.innerText = key === '未分類' ? '未分類活動' : monthLabel(key);
                    monthBlock.appendChild(monthHeader);

                    // 第三層：活動，透明底白字
                    groupMap[key].forEach(ev => {
                        const row = document.createElement('div');
                        row.className = 'event-row';

                        const gcalUrl = buildGoogleCalendarUrl(ev);
                        const gcalHtml = gcalUrl
                            ? `<a class="gcal-btn" href="${gcalUrl}" target="_blank" rel="noopener">📅 加入日曆</a>`
                            : '';

                        // 活動時間：直接取用開始/結束時間欄位組成「7:00-16:00」樣式的文字
                        let activityTime = '';
                        if (ev.start_time && ev.end_time) {
                            activityTime = `${ev.start_time}-${ev.end_time}`;
                        } else if (ev.start_time) {
                            activityTime = ev.start_time;
                        }
                        const metaParts = [];
                        if (activityTime) metaParts.push(activityTime);
                        if (ev.location) metaParts.push(ev.location);

                        row.innerHTML = `
                            <div class="event-title-line">
                                <span><strong>${ev.time || ''}</strong>　${ev.title || ''}</span>
                                ${gcalHtml}
                            </div>
                            ${metaParts.length > 0 ? `<div class="event-meta-line">${metaParts.join('　|　')}</div>` : ''}
                            ${ev.desc ? `<div class="event-detail">${ev.desc}</div>` : ''}
                            ${ev.note ? `<div class="event-note">⚠ ${ev.note}</div>` : ''}
                        `;
                        monthBlock.appendChild(row);
                    });

                    semesterGroup.appendChild(monthBlock);
                });

                container.appendChild(semesterGroup);
            }

            // 燈箱開關邏輯
            function openLightbox(imageSrc, caption) {
                const overlay = document.getElementById('lightbox-overlay');
                const img = document.getElementById('lightbox-image');
                const captionEl = document.getElementById('lightbox-caption');
                img.src = imageSrc;
                img.alt = caption || '';
                captionEl.innerText = caption || '';
                overlay.classList.add('active');
            }
            function closeLightbox() {
                document.getElementById('lightbox-overlay').classList.remove('active');
            }
            document.getElementById('lightbox-overlay').addEventListener('click', (e) => {
                // 點擊圖片本身不關閉，點背景或叉叉才關閉
                if (e.target.id === 'lightbox-overlay' || e.target.id === 'lightbox-close') {
                    closeLightbox();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeLightbox();
            });

            // 導覽列文字與品牌角標：讀取 data/home.json 的 nav 設定，跟其他頁面共用同一份資料
            fetch('data/home.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (!data.nav) return;
                    setText('nav-badge', data.nav.badge);
                    setText('nav-brand', data.nav.brand);
                    if (data.nav.brand_sub) setText('nav-brand-sub', '| ' + data.nav.brand_sub);
                    setTextAll('nav-link-home', data.nav.link_home);
                    setTextAll('nav-link-method', data.nav.link_method);
                    setTextAll('nav-link-activities', data.nav.link_activities);
                    setTextAll('nav-link-calendar', data.nav.link_calendar);
                })
                .catch(error => console.error('讀取 data/home.json 失敗：', error));

            // 本頁主要內容：讀取 data/calendar.json
            fetch('data/calendar.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {

                    // 本學期行事曆：支援多筆（例如中文版 + 英文版）並排小圖預覽
                    if (data.semester_schedule) {
                        const wrap = document.getElementById('semester-schedule');
                        const titleEl = document.getElementById('semester-schedule-title');
                        const grid = document.getElementById('semester-schedule-grid');

                        if (data.semester_schedule.title) {
                            titleEl.innerText = data.semester_schedule.title;
                            titleEl.style.display = 'block';
                        }

                        // 資料格式：data.semester_schedule.items 是一個陣列，每筆代表一種語言版本的行事曆
                        // 例如：[{label:"中文版", display_image:"...", download_file:"...", download_label:"下載中文行事曆"}, {label:"English", ...}]
                        const items = Array.isArray(data.semester_schedule.items) ? data.semester_schedule.items : [];

                        if (items.length > 0) {
                            grid.innerHTML = '';
                            items.forEach(item => {
                                const card = document.createElement('div');
                                card.className = 'schedule-card';

                                if (item.label) {
                                    const labelEl = document.createElement('div');
                                    labelEl.className = 'schedule-card-label';
                                    labelEl.innerText = item.label;
                                    card.appendChild(labelEl);
                                }

                                if (item.display_image) {
                                    const thumbWrap = document.createElement('div');
                                    thumbWrap.className = 'schedule-thumb-wrap';
                                    const img = document.createElement('img');
                                    img.src = resolveImagePath(item.display_image);
                                    img.alt = item.label || '本學期行事曆';
                                    thumbWrap.appendChild(img);

                                    const hint = document.createElement('div');
                                    hint.className = 'schedule-thumb-hint';
                                    hint.innerText = '點擊看大圖';
                                    thumbWrap.appendChild(hint);

                                    thumbWrap.addEventListener('click', () => {
                                        openLightbox(resolveImagePath(item.display_image), item.label);
                                    });
                                    card.appendChild(thumbWrap);
                                }

                                if (item.download_file) {
                                    const downloadBtn = document.createElement('a');
                                    downloadBtn.className = 'download-btn';
                                    downloadBtn.href = resolveImagePath(item.download_file);
                                    downloadBtn.target = '_blank';
                                    downloadBtn.rel = 'noopener';
                                    downloadBtn.innerText = item.download_label || '下載行事曆';
                                    card.appendChild(downloadBtn);
                                }

                                grid.appendChild(card);
                            });

                            wrap.style.display = 'block';
                        }
                    }

                    // 三層行事曆：學期 → 月份 → 活動
                    renderScheduleEvents(data.semester_title, data.events);
                })
                .catch(error => {
                    document.getElementById('calendar-events-container').innerHTML = '<p style="text-align:center; color:red;">曆法載入失敗，請確認資料庫陣法。</p>';
                });
        </script>
    </div>

</body>
</html>
