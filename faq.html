<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常見問題｜政大太極社</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓所有頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // 關閉 preflight（Tailwind 的預設樣式重置），避免影響本頁原本手寫的 CSS
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        ink: { deep: '#08090A', dark: '#111315', card: '#181B1E' },
                        cloud: '#8E95A0',
                        pine: { light: '#427A5B', DEFAULT: '#1E3D2F', dark: '#0F2118' },
                        bronze: { light: '#D9C39E', DEFAULT: '#B89742', dark: '#8C6C30' }
                    },
                    fontFamily: { serif: ['Noto Serif TC', 'serif'] }
                }
            }
        }
    </script>

    <style>
        /* 全域 box-sizing 修正：Tailwind preflight 關閉後，少了這條關鍵重置，
           導致所有有 padding 的區塊實際寬度都會比容器多撐出 padding 的量，
           這正是手機版圖片/文字被切掉、出現橫向溢出的根本原因 */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        :root {
            --玄色: #121212; --霧霾灰: #A0A0A0; --松柏綠: #5C9A6C; --古銅金: #C5A059; --仙氣白: #E5E5E5;
        }
        html { overflow-x: hidden; max-width: 100%; }
        /* 圖片保護：子頁關閉了 preflight，少了瀏覽器預設會有的「圖片自動縮小配合容器寬度」規則，這裡補回來 */
        img {
            max-width: 100%;
            height: auto;
        }
        body { background-color: var(--玄色); color: var(--仙氣白); font-family: 'Noto Serif TC', serif; margin: 0; line-height: 1.8; overflow-x: hidden; }
        .container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        h1 { color: var(--古銅金); text-align: center; letter-spacing: 4px; font-size: 2.2rem; }
        .subtitle { text-align: center; color: var(--霧霾灰); font-style: italic; margin-bottom: 60px; font-size: 0.95rem; }

        /* FAQ 手風琴：問題金色大字，答案白色，點擊展開/收合 */
        .faq-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .faq-item:hover {
            border-color: rgba(184, 151, 66, 0.4);
        }
        .faq-question {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            padding: 18px 20px;
            font-family: inherit;
        }
        .faq-question .q-mark {
            flex-shrink: 0;
            color: var(--古銅金);
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid rgba(197, 160, 89, 0.5);
            border-style: solid;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .faq-question .q-text {
            flex: 1;
            min-width: 0;
            color: var(--古銅金);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }
        .faq-question .chevron {
            flex-shrink: 0;
            color: var(--霧霾灰);
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }
        .faq-item.open .chevron {
            transform: rotate(180deg);
        }
        .faq-answer {
            display: none;
            padding: 0 20px 20px 64px;
        }
        .faq-item.open .faq-answer {
            display: block;
        }
        .faq-answer p {
            color: var(--仙氣白);
            font-size: 0.95rem;
            line-height: 1.9;
            margin: 0;
        }

        .faq-empty-hint {
            text-align: center;
            color: var(--霧霾灰);
            font-size: 0.85rem;
        }

        /* 問題分類群組：灰色小字標籤放在該組問題左上方，點擊可整組收合/展開 */
        .faq-category {
            margin-bottom: 36px;
        }
        .faq-category:last-child {
            margin-bottom: 0;
        }
        .faq-category-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 0 12px 4px;
            color: var(--霧霾灰);
            font-size: 0.78rem;
            letter-spacing: 3px;
            font-family: inherit;
        }
        .faq-category-header .category-chevron {
            font-size: 0.65rem;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .faq-category.collapsed .category-chevron {
            transform: rotate(-90deg);
        }
        .faq-category-items {
            display: block;
        }
        .faq-category.collapsed .faq-category-items {
            display: none;
        }

        /* 手機版漢堡選單按鈕：因子頁關閉了 Tailwind 的 preflight，瀏覽器預設的按鈕框線/背景會跑出來，這裡手動重置 */
        #mobile-menu-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        /* 中英文切換按鈕：同樣因為關閉 preflight，瀏覽器預設的白底樣式會跑出來，這裡重置成透明底＋實線金色框，跟首頁一致 */
        #lang-toggle-desktop, #lang-toggle-mobile {
            background: none;
            border-style: solid;
            cursor: pointer;
            font-family: inherit; /* 按鈕預設不會繼承頁面字體，這裡強制套用跟首頁一樣的宋體 */
        }
    </style>
</head>
<body>

    <!-- 全站共用的語言切換邏輯，要在其他腳本之前載入 -->
    <script src="lang.js"></script>

    <!-- 整合版：頂部道門天際導覽（含手機版漢堡選單），與首頁共用同一套設計 -->
    <header class="sticky top-0 left-0 w-full z-50 bg-ink-deep/90 backdrop-blur-md border-b border-white/5 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center relative">

            <!-- 左側：道場牌匾 + 手機版語言切換鈕（一直顯示，不用點開漢堡選單） -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-bold tracking-widest text-bronze-light flex items-center gap-2 transition-colors duration-300 hover:text-white no-underline">
                    <span id="nav-badge" class="text-xs border border-solid border-bronze px-1.5 py-0.5 rounded whitespace-nowrap">政大</span>
                    <span id="nav-brand" class="whitespace-nowrap">太極社</span> <span id="nav-brand-sub" class="hidden sm:inline font-light text-sm text-cloud/70 whitespace-nowrap">| 隱逸道場</span>
                </a>
                <button id="lang-toggle-mobile" type="button" class="md:hidden text-xs tracking-widest text-bronze-light border border-bronze/50 rounded px-2 py-1 hover:bg-bronze/10 transition-colors">EN</button>
            </div>

            <!-- 右側：電腦版跨頁導覽連結 -->
            <nav class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">首頁主殿</a>
                <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">法門深造</a>
                <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">活動介紹</a>
                <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">修煉日程</a>
                <a href="faq.html" class="nav-link-faq no-underline text-sm tracking-widest text-bronze-light font-bold">常見問題</a>
                <button id="lang-toggle-desktop" type="button" class="text-xs tracking-widest text-bronze-light border border-bronze/50 rounded px-2.5 py-1 hover:bg-bronze/10 transition-colors">EN</button>
            </nav>

            <!-- 右側：手機版漢堡選單按鈕 -->
            <button id="mobile-menu-btn" class="md:hidden text-bronze-light hover:text-white focus:outline-none transition-colors">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- 手機版下拉選單區塊：只放頁面連結，語言切換鈕已經移到牌匾旁邊 -->
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-ink-deep/95 backdrop-blur-lg border-b border-white/10 flex-col items-center py-6 space-y-6 shadow-2xl transition-all duration-300 z-40">
            <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">首頁主殿</a>
            <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">法門深造</a>
            <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">活動介紹</a>
            <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">修煉日程</a>
            <a href="faq.html" class="nav-link-faq no-underline text-sm tracking-widest text-bronze-light font-bold w-full text-center block">常見問題</a>
        </nav>
    </header>

    <!-- 手機版選單開關腳本 + 語言切換按鈕初始化 -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
        initLangSwitcher('lang-toggle-desktop');
        initLangSwitcher('lang-toggle-mobile');
    </script>

    <div class="container">
        <h1 id="page-title">常見問題</h1>
        <div class="subtitle" id="page-subtitle">「初入道場，難免心有疑惑。此處為你解惑，助你安心踏上修煉之路。」</div>

        <!-- 動態 FAQ 載入區塊 -->
        <div id="faq-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱常見疑問，載入中...</div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            function setText(id, value) {
                const el = document.getElementById(id);
                if (el && value !== undefined && value !== null) el.innerText = value;
            }
            function setTextAll(className, value) {
                if (value === undefined || value === null) return;
                document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
            }

            // 展開/收合單一 FAQ 項目
            function toggleFaqItem(item) {
                item.classList.toggle('open');
            }

            // 導覽列文字與品牌角標：讀取 data/home.json 的 nav 設定，跟其他頁面共用同一份資料
            fetch('data/home.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容
                    if (!data.nav) return;
                    setText('nav-badge', data.nav.badge);
                    setText('nav-brand', data.nav.brand);
                    if (data.nav.brand_sub) setText('nav-brand-sub', '| ' + data.nav.brand_sub);
                    setTextAll('nav-link-home', data.nav.link_home);
                    setTextAll('nav-link-method', data.nav.link_method);
                    setTextAll('nav-link-activities', data.nav.link_activities);
                    setTextAll('nav-link-calendar', data.nav.link_calendar);
                    setTextAll('nav-link-faq', data.nav.link_faq);
                })
                .catch(error => console.error('讀取 data/home.json 失敗：', error));

            // 本頁主要內容：讀取 data/faq.json
            fetch('data/faq.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容

                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('faq-container');
                    container.innerHTML = '';

                    const list = Array.isArray(data.faqs) ? data.faqs : [];
                    if (list.length === 0) {
                        container.innerHTML = '<p class="faq-empty-hint">目前尚無常見問題內容。</p>';
                        return;
                    }

                    // 產生單一問答項目（Q 金色大字／A 白色文字），可點擊展開收合
                    function renderFaqItem(item, isFirstOverall) {
                        const wrap = document.createElement('div');
                        wrap.className = 'faq-item';

                        const questionBtn = document.createElement('button');
                        questionBtn.type = 'button';
                        questionBtn.className = 'faq-question';
                        questionBtn.innerHTML = `
                            <span class="q-mark">Q</span>
                            <span class="q-text"></span>
                            <span class="chevron">▾</span>
                        `;
                        questionBtn.querySelector('.q-text').innerText = item.question || '';
                        questionBtn.addEventListener('click', () => toggleFaqItem(wrap));
                        wrap.appendChild(questionBtn);

                        const answerWrap = document.createElement('div');
                        answerWrap.className = 'faq-answer';
                        const answerP = document.createElement('p');
                        answerP.innerText = item.answer || '';
                        answerWrap.appendChild(answerP);
                        wrap.appendChild(answerWrap);

                        // 全部問題裡的第一題預設展開，讓訪客一進頁面就知道是可以點的
                        if (isFirstOverall) wrap.classList.add('open');

                        return wrap;
                    }

                    // 依「分類」把問題分組（灰色小字標籤），維持後台輸入的先後順序；分類標題可點擊整組收合/展開
                    const groupOrder = [];
                    const groupMap = {};
                    list.forEach(item => {
                        const cat = (item.category && item.category.trim() !== '') ? item.category.trim() : '其他';
                        if (!groupMap[cat]) {
                            groupMap[cat] = [];
                            groupOrder.push(cat);
                        }
                        groupMap[cat].push(item);
                    });

                    let isFirstOverall = true;
                    groupOrder.forEach(cat => {
                        const categoryWrap = document.createElement('div');
                        categoryWrap.className = 'faq-category';

                        const header = document.createElement('button');
                        header.type = 'button';
                        header.className = 'faq-category-header';
                        header.innerHTML = `<span class="category-chevron">▾</span><span></span>`;
                        header.querySelector('span:last-child').innerText = cat;
                        header.addEventListener('click', () => categoryWrap.classList.toggle('collapsed'));
                        categoryWrap.appendChild(header);

                        const itemsWrap = document.createElement('div');
                        itemsWrap.className = 'faq-category-items';
                        groupMap[cat].forEach(item => {
                            const itemEl = renderFaqItem(item, isFirstOverall);
                            isFirstOverall = false;
                            itemsWrap.appendChild(itemEl);
                        });
                        categoryWrap.appendChild(itemsWrap);

                        container.appendChild(categoryWrap);
                    });
                })
                .catch(error => {
                    document.getElementById('faq-container').innerHTML = '<div style="text-align:center; color:red;">常見問題讀取失敗。</div>';
                });
        </script>

    </div>

</body>
</html>
