<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常見問題｜政大太極社</title>
    <meta name="description" content="政大太極社常見問題整理：入門須知、課程安排、社費資訊、國際交流等新生最想了解的問題解答。">
    <link rel="canonical" href="https://nccutaichiclub.github.io/Taichi-club-website/faq.html">
    <!-- Open Graph 標籤：讓 LINE／FB／IG 分享連結時顯示漂亮的預覽卡片 -->
    <meta property="og:title" content="常見問題｜政大太極社">
    <meta property="og:description" content="政大太極社常見問題整理：入門須知、課程安排、社費資訊、國際交流等新生最想了解的問題解答。">
    <meta property="og:url" content="https://nccutaichiclub.github.io/Taichi-club-website/faq.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <!-- 引入思源宋體，跟首頁共用同一套字重設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓所有頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config-sub.js"></script>

    <!-- 四個子頁共用的基礎樣式（box-sizing 修正、圖片保護、容器/標題基本樣式等） -->
    <link rel="stylesheet" href="css/base.css">

    <style>
        /* 本頁專屬的樣式覆蓋：容器寬度比其他子頁窄一點 */
        .container { max-width: 800px; }

        /* FAQ 手風琴：問題金色大字，答案白色，點擊展開/收合 */
        .faq-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .faq-item:hover {
            border-color: rgba(184, 151, 66, 0.4);
        }
        .faq-question {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            padding: 18px 20px;
            font-family: inherit;
        }
        .faq-question .q-mark {
            flex-shrink: 0;
            color: var(--古銅金);
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid rgba(197, 160, 89, 0.5);
            border-style: solid;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .faq-question .q-text {
            flex: 1;
            min-width: 0;
            color: var(--古銅金);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }
        .faq-question .chevron {
            flex-shrink: 0;
            color: var(--霧霾灰);
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }
        .faq-item.open .chevron {
            transform: rotate(180deg);
        }
        .faq-answer {
            display: none;
            padding: 0 20px 20px 64px;
        }
        .faq-item.open .faq-answer {
            display: block;
        }
        .faq-answer p {
            color: var(--仙氣白);
            font-size: 0.95rem;
            line-height: 1.9;
            margin: 0;
        }

        .faq-empty-hint {
            text-align: center;
            color: var(--霧霾灰);
            font-size: 0.85rem;
        }

        /* 問題分類群組：灰色小字標籤放在該組問題左上方，點擊可整組收合/展開 */
        .faq-category {
            margin-bottom: 36px;
        }
        .faq-category:last-child {
            margin-bottom: 0;
        }
        .faq-category-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 0 12px 4px;
            color: var(--霧霾灰);
            font-size: 0.78rem;
            letter-spacing: 3px;
            font-family: inherit;
        }
        .faq-category-header .category-chevron {
            font-size: 0.65rem;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .faq-category.collapsed .category-chevron {
            transform: rotate(-90deg);
        }
        .faq-category-items {
            display: block;
        }
        .faq-category.collapsed .faq-category-items {
            display: none;
        }

        /* 手機版漢堡選單按鈕與中英文切換按鈕的樣式重置，已經統一移到 header.js 裡處理 */
    </style>
</head>
<body>

    <!-- 全站共用的語言切換邏輯，要在其他腳本之前載入 -->
    <script src="js/lang.js"></script>

    <!-- 頂部導覽列：由 header.js 統一產生，改導覽列只要改那支檔案，不用每頁各改一次 -->
    <div id="site-header"></div>
    <script src="js/header.js"></script>

    <div class="container">
        <h1 id="page-title">常見問題</h1>
        <div class="subtitle" id="page-subtitle">「初入道場，難免心有疑惑。此處為你解惑，助你安心踏上修煉之路。」</div>

        <!-- 動態 FAQ 載入區塊 -->
        <div id="faq-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱常見疑問，載入中...</div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            // 展開/收合單一 FAQ 項目
            function toggleFaqItem(item) {
                item.classList.toggle('open');
            }

            // 本頁主要內容：讀取 data/faq.json
            fetch('data/faq.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容

                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('faq-container');
                    container.innerHTML = '';

                    const categories = Array.isArray(data.categories) ? data.categories : [];
                    if (categories.length === 0) {
                        container.innerHTML = '<p class="faq-empty-hint">目前尚無常見問題內容。</p>';
                        return;
                    }

                    // 產生單一問答項目（Q 金色大字／A 白色文字），可點擊展開收合
                    function renderFaqItem(item, isFirstOverall) {
                        const wrap = document.createElement('div');
                        wrap.className = 'faq-item';

                        const questionBtn = document.createElement('button');
                        questionBtn.type = 'button';
                        questionBtn.className = 'faq-question';
                        questionBtn.innerHTML = `
                            <span class="q-mark">Q</span>
                            <span class="q-text"></span>
                            <span class="chevron">▾</span>
                        `;
                        questionBtn.querySelector('.q-text').innerText = item.question || '';
                        questionBtn.addEventListener('click', () => toggleFaqItem(wrap));
                        wrap.appendChild(questionBtn);

                        const answerWrap = document.createElement('div');
                        answerWrap.className = 'faq-answer';
                        const answerP = document.createElement('p');
                        answerP.innerHTML = parseInlineMarkup(item.answer || '');
                        answerWrap.appendChild(answerP);
                        wrap.appendChild(answerWrap);

                        // 全部問題裡的第一題預設展開，讓訪客一進頁面就知道是可以點的
                        if (isFirstOverall) wrap.classList.add('open');

                        return wrap;
                    }

                    // 分類本身在後台就是可以直接拖曳排序的清單，這裡直接依資料順序渲染即可，
                    // 不用再自己額外分組——拖曳分類順序時，底下所有問題自然整組跟著移動
                    let isFirstOverall = true;
                    categories.forEach(cat => {
                        const categoryWrap = document.createElement('div');
                        categoryWrap.className = 'faq-category';

                        const header = document.createElement('button');
                        header.type = 'button';
                        header.className = 'faq-category-header';
                        header.innerHTML = `<span class="category-chevron">▾</span><span></span>`;
                        header.querySelector('span:last-child').innerText = cat.category || '';
                        header.addEventListener('click', () => categoryWrap.classList.toggle('collapsed'));
                        categoryWrap.appendChild(header);

                        const itemsWrap = document.createElement('div');
                        itemsWrap.className = 'faq-category-items';
                        const questions = Array.isArray(cat.questions) ? cat.questions : [];
                        questions.forEach(item => {
                            const itemEl = renderFaqItem(item, isFirstOverall);
                            isFirstOverall = false;
                            itemsWrap.appendChild(itemEl);
                        });
                        categoryWrap.appendChild(itemsWrap);

                        container.appendChild(categoryWrap);
                    });
                })
                .catch(error => {
                    document.getElementById('faq-container').innerHTML = '<div style="text-align:center; color:red;">常見問題讀取失敗。</div>';
                });
        </script>

    </div>

</body>
</html>
