<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動介紹｜政大太極社</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓四個頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // 關閉 preflight（Tailwind 的預設樣式重置），避免影響本頁原本手寫的 CSS
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        ink: { deep: '#08090A', dark: '#111315', card: '#181B1E' },
                        cloud: '#8E95A0',
                        pine: { light: '#427A5B', DEFAULT: '#1E3D2F', dark: '#0F2118' },
                        bronze: { light: '#D9C39E', DEFAULT: '#B89742', dark: '#8C6C30' }
                    },
                    fontFamily: { serif: ['Noto Serif TC', 'serif'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --玄色: #121212; --霧霾灰: #A0A0A0; --松柏綠: #5C9A6C; --古銅金: #C5A059; --仙氣白: #E5E5E5;
        }
        body { background-color: var(--玄色); color: var(--仙氣白); font-family: 'Noto Serif TC', serif; margin: 0; line-height: 1.8; }
        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        h1 { color: var(--古銅金); text-align: center; letter-spacing: 4px; font-size: 2.2rem; }
        .subtitle { text-align: center; color: var(--霧霾灰); font-style: italic; margin-bottom: 60px; font-size: 0.95rem; }

        .activity-detail {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .activity-detail h2 {
            color: var(--松柏綠);
            background-color: rgba(160, 160, 160, 0.15);
            display: inline-block;
            padding: 10px 18px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid var(--古銅金);
            border-right: 4px solid var(--古銅金);
        }

        .activity-text p {
            margin: 0 0 16px 0;
        }
        .activity-text p:last-child {
            margin-bottom: 0;
        }

        /* 歷年活動照片：相簿式網格 */
        .activity-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 28px;
        }
        .activity-photo {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #1A1A1A;
            border: 1px solid rgba(160, 160, 160, 0.15);
        }
        .activity-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .activity-photo:hover img {
            transform: scale(1.06);
        }
        .activity-photo .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
            color: var(--仙氣白);
            font-size: 0.75rem;
            padding: 16px 8px 6px;
            text-align: center;
        }
        .gallery-empty-hint {
            color: var(--霧霾灰);
            font-size: 0.8rem;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <!-- 整合版：頂部道門天際導覽（含手機版漢堡選單），與首頁共用同一套設計 -->
    <header class="sticky top-0 left-0 w-full z-50 bg-ink-deep/90 backdrop-blur-md border-b border-white/5 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center relative">

            <!-- 左側：道場牌匾 -->
            <a href="index.html" class="text-xl font-bold tracking-widest text-bronze-light flex items-center gap-2 transition-colors duration-300 hover:text-white no-underline">
                <span id="nav-badge" class="text-xs border border-solid border-bronze px-1.5 py-0.5 rounded">政大</span>
                <span id="nav-brand">太極社</span> <span id="nav-brand-sub" class="font-light text-sm text-cloud/70">| 隱逸道場</span>
            </a>

            <!-- 右側：電腦版跨頁導覽連結 -->
            <nav class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">首頁主殿</a>
                <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">法門深造</a>
                <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-bronze-light font-bold">活動介紹</a>
                <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">修煉日程</a>
            </nav>

            <!-- 右側：手機版漢堡選單按鈕 -->
            <button id="mobile-menu-btn" class="md:hidden text-bronze-light hover:text-white focus:outline-none transition-colors">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- 手機版下拉選單區塊 -->
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-ink-deep/95 backdrop-blur-lg border-b border-white/10 flex-col items-center py-6 space-y-6 shadow-2xl transition-all duration-300 z-40">
            <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">首頁主殿</a>
            <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">法門深造</a>
            <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-bronze-light font-bold w-full text-center block">活動介紹</a>
            <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">修煉日程</a>
        </nav>
    </header>

    <!-- 手機版選單開關腳本 -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
    </script>

    <div class="container">
        <h1 id="page-title">活動點點滴滴</h1>
        <div class="subtitle" id="page-subtitle">「紀錄每一次揮灑汗水、交心暢談的珍貴時光。」</div>

        <!-- 動態活動載入區塊 -->
        <div id="activities-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱活動紀事，載入中...</div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            function setText(id, value) {
                const el = document.getElementById(id);
                if (el && value !== undefined && value !== null) el.innerText = value;
            }
            function setTextAll(className, value) {
                if (value === undefined || value === null) return;
                document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
            }

            // 把後台填的「純文字」自動轉成一段一段的 <p>：空一行 = 分段；段落內單純換行 = 換行(<br>)
            function paragraphize(text) {
                if (!text) return '';
                return text
                    .split(/\n\s*\n/)
                    .map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`)
                    .join('');
            }

            // 圖片路徑防呆：本網站放在 .../Taichi-club-website/ 這個子路徑下，
            // 如果圖片路徑意外帶了開頭的 "/"，這裡統一拿掉，改成正確的相對路徑
            function resolveImagePath(path) {
                if (!path) return '';
                return path.replace(/^\/+/, '');
            }

            // 導覽列文字與品牌角標：讀取 data/home.json 的 nav 設定，跟其他頁面共用同一份資料
            fetch('data/home.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (!data.nav) return;
                    setText('nav-badge', data.nav.badge);
                    setText('nav-brand', data.nav.brand);
                    if (data.nav.brand_sub) setText('nav-brand-sub', '| ' + data.nav.brand_sub);
                    setTextAll('nav-link-home', data.nav.link_home);
                    setTextAll('nav-link-method', data.nav.link_method);
                    setTextAll('nav-link-activities', data.nav.link_activities);
                    setTextAll('nav-link-calendar', data.nav.link_calendar);
                })
                .catch(error => console.error('讀取 data/home.json 失敗：', error));

            // 本頁主要內容：讀取 data/activities.json
            fetch('data/activities.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('activities-container');
                    container.innerHTML = '';

                    (data.activities || []).forEach(activity => {
                        const wrap = document.createElement('div');
                        wrap.className = 'activity-detail';

                        const heading = document.createElement('h2');
                        heading.innerText = activity.title || '';
                        wrap.appendChild(heading);

                        const textDiv = document.createElement('div');
                        textDiv.className = 'activity-text';
                        textDiv.innerHTML = paragraphize(activity.desc);
                        wrap.appendChild(textDiv);

                        const photos = Array.isArray(activity.photos) ? activity.photos : [];
                        if (photos.length > 0) {
                            const gallery = document.createElement('div');
                            gallery.className = 'activity-gallery';
                            photos.forEach(p => {
                                const photoBox = document.createElement('div');
                                photoBox.className = 'activity-photo';
                                const img = document.createElement('img');
                                img.src = resolveImagePath(p.image);
                                img.alt = p.caption || activity.title || '';
                                photoBox.appendChild(img);
                                if (p.caption) {
                                    const cap = document.createElement('div');
                                    cap.className = 'caption';
                                    cap.innerText = p.caption;
                                    photoBox.appendChild(cap);
                                }
                                gallery.appendChild(photoBox);
                            });
                            wrap.appendChild(gallery);
                        }

                        container.appendChild(wrap);
                    });
                })
                .catch(error => {
                    document.getElementById('activities-container').innerHTML = '<div style="text-align:center; color:red;">活動紀事讀取失敗。</div>';
                });
        </script>

    </div>

</body>
</html>
