<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動介紹｜政大太極社</title>
    <meta name="description" content="政大太極社歷年活動紀錄，包含迎新、社遊、包春捲、期末大會等社團活動花絮與照片集。">
    <link rel="canonical" href="https://nccutaichiclub.github.io/Taichi-club-website/activities.html">
    <!-- Open Graph 標籤：讓 LINE／FB／IG 分享連結時顯示漂亮的預覽卡片 -->
    <meta property="og:title" content="活動介紹｜政大太極社">
    <meta property="og:description" content="政大太極社歷年活動紀錄，包含迎新、社遊、包春捲、期末大會等社團活動花絮與照片集。">
    <meta property="og:url" content="https://nccutaichiclub.github.io/Taichi-club-website/activities.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <!-- 引入思源宋體，跟首頁共用同一套字重設定 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓四個頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config-sub.js"></script>

    <!-- 四個子頁共用的基礎樣式（box-sizing 修正、圖片保護、容器/標題基本樣式等） -->
    <link rel="stylesheet" href="css/base.css">

    <style>
        .activity-detail {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .activity-detail h2 {
            color: var(--松柏綠);
            background-color: rgba(160, 160, 160, 0.15);
            display: inline-block;
            padding: 10px 18px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid var(--古銅金);
            border-right: 4px solid var(--古銅金);
        }

        .activity-text p {
            margin: 0 0 16px 0;
        }
        .activity-text p:last-child {
            margin-bottom: 0;
        }

        /* 歷年活動照片：小尺寸封面預覽（不管照片幾張，都只佔一個小方塊的版面）
           一個活動可以有多組照片集，用 flex 並排顯示，手機版會自動換行 */
        .activity-gallery-preview {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .gallery-cover {
            position: relative;
            width: 150px;
            height: 112px;
            border-radius: 10px;
            overflow: hidden;
            cursor: zoom-in;
            background: #1A1A1A;
            border: 1px solid rgba(160, 160, 160, 0.15);
        }
        .gallery-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .gallery-cover:hover img {
            transform: scale(1.06);
        }
        .gallery-count-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: var(--仙氣白);
            font-size: 0.7rem;
            padding: 20px 8px 6px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        /* 手機版縮圖再縮小一點，確保不佔用介紹欄位太多空間 */
        @media (max-width: 640px) {
            .gallery-cover {
                width: 110px;
                height: 82px;
            }
            .gallery-count-badge {
                font-size: 0.62rem;
                padding: 16px 4px 4px;
            }
        }

        /* 全螢幕相片集燈箱：點縮圖後開啟，可左右切換 */
        .gallery-lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .gallery-lightbox-overlay.active {
            display: flex;
        }
        .gallery-lightbox-img-wrap {
            max-width: 90vw;
            max-height: 85vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-lightbox-img-wrap img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: block;
        }
        .gallery-lightbox-close {
            position: absolute;
            top: 18px;
            right: 24px;
            color: var(--仙氣白);
            font-size: 2rem;
            line-height: 1;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1002;
        }
        .gallery-lightbox-counter {
            position: absolute;
            top: 22px;
            left: 26px;
            color: var(--霧霾灰);
            font-size: 0.8rem;
            letter-spacing: 1px;
            z-index: 1002;
        }
        .gallery-lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--仙氣白);
            font-size: 1.6rem;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1002;
            user-select: none;
        }
        .gallery-lightbox-arrow.prev { left: 14px; }
        .gallery-lightbox-arrow.next { right: 14px; }
        .gallery-lightbox-arrow:hover { background: rgba(255,255,255,0.2); }
        .gallery-lightbox-caption {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--古銅金);
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 0 60px;
        }
        @media (max-width: 640px) {
            .gallery-lightbox-arrow {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
            }
        }
        .gallery-empty-hint {
            color: var(--霧霾灰);
            font-size: 0.8rem;
            margin-top: 16px;
        }

        /* 手機版漢堡選單按鈕與中英文切換按鈕的樣式重置，已經統一移到 header.js 裡處理 */
    </style>
</head>
<body>

    <!-- 全站共用的語言切換邏輯，要在其他腳本之前載入 -->
    <script src="js/lang.js"></script>

    <!-- 頁面載入遮罩：資料抓回來、內容都填好之前先蓋住畫面，避免看到預留文字閃一下才變成正確內容 -->
    <div id="page-loading-overlay" style="position:fixed;inset:0;background:#121212;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
        <div style="color:#C5A059;font-family:'Noto Serif TC',serif;letter-spacing:4px;font-size:0.9rem;">道場開啟中...</div>
    </div>

    <!-- 頂部導覽列：由 header.js 統一產生，改導覽列只要改那支檔案，不用每頁各改一次 -->
    <div id="site-header"></div>
    <script src="js/header.js"></script>


    <div class="container">
        <h1 id="page-title">活動點點滴滴</h1>
        <div class="subtitle" id="page-subtitle">「紀錄每一次揮灑汗水、交心暢談的珍貴時光。」</div>

        <!-- 動態活動載入區塊 -->
        <div id="activities-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱活動紀事，載入中...</div>
        </div>

        <!-- 全螢幕相片集燈箱：所有活動共用同一組，開啟時依索引顯示對應的活動照片 -->
        <div id="gallery-lightbox-overlay" class="gallery-lightbox-overlay">
            <button id="gallery-lightbox-close" class="gallery-lightbox-close" aria-label="關閉">&times;</button>
            <div id="gallery-lightbox-counter" class="gallery-lightbox-counter"></div>
            <button id="gallery-lightbox-prev" class="gallery-lightbox-arrow prev" aria-label="上一張">&#10094;</button>
            <div id="gallery-lightbox-img-wrap" class="gallery-lightbox-img-wrap">
                <img id="gallery-lightbox-image" src="" alt="">
            </div>
            <button id="gallery-lightbox-next" class="gallery-lightbox-arrow next" aria-label="下一張">&#10095;</button>
            <div id="gallery-lightbox-caption" class="gallery-lightbox-caption"></div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            // ===== 全螢幕相片集燈箱邏輯 =====
            // galleryData 是攤平的照片集陣列：galleryData[N] = 第N組照片集的照片陣列 [{image, caption}, ...]
            // 一個活動可能對應好幾組照片集，所以不是用活動編號索引，而是用「渲染時遇到的順序」索引
            let galleryData = [];
            let currentGalleryIndex = 0;
            let currentPhotoIndex = 0;

            function renderLightboxPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                const photo = photos[currentPhotoIndex];
                const imgEl = document.getElementById('gallery-lightbox-image');
                imgEl.src = resolveImagePath(photo.image);
                imgEl.alt = photo.caption || '';
                document.getElementById('gallery-lightbox-caption').innerText = photo.caption || '';
                document.getElementById('gallery-lightbox-counter').innerText = `${currentPhotoIndex + 1} / ${photos.length}`;
            }
            function openGalleryLightbox(activityIndex, photoIndex) {
                currentGalleryIndex = activityIndex;
                currentPhotoIndex = photoIndex;
                renderLightboxPhoto();
                document.getElementById('gallery-lightbox-overlay').classList.add('active');
            }
            function closeGalleryLightbox() {
                document.getElementById('gallery-lightbox-overlay').classList.remove('active');
            }
            function showPrevPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
                renderLightboxPhoto();
            }
            function showNextPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
                renderLightboxPhoto();
            }

            document.getElementById('gallery-lightbox-close').addEventListener('click', closeGalleryLightbox);
            document.getElementById('gallery-lightbox-prev').addEventListener('click', showPrevPhoto);
            document.getElementById('gallery-lightbox-next').addEventListener('click', showNextPhoto);
            // 點背景（非圖片本身）也可以關閉
            document.getElementById('gallery-lightbox-overlay').addEventListener('click', (e) => {
                if (e.target.id === 'gallery-lightbox-overlay') closeGalleryLightbox();
            });
            // 鍵盤操作：左右鍵切換、Esc 關閉
            document.addEventListener('keydown', (e) => {
                const overlay = document.getElementById('gallery-lightbox-overlay');
                if (!overlay.classList.contains('active')) return;
                if (e.key === 'Escape') closeGalleryLightbox();
                if (e.key === 'ArrowLeft') showPrevPhoto();
                if (e.key === 'ArrowRight') showNextPhoto();
            });
            // 手機觸控滑動：左滑下一張、右滑上一張
            let touchStartX = 0;
            const lightboxImgWrap = document.getElementById('gallery-lightbox-img-wrap');
            lightboxImgWrap.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            lightboxImgWrap.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        showPrevPhoto();
                    } else {
                        showNextPhoto();
                    }
                }
            });

            // 本頁主要內容：讀取 data/activities.json
            fetch('data/activities.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容
                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('activities-container');
                    container.innerHTML = '';
                    galleryData = []; // 每次重新載入時清空，避免資料累加重複

                    (data.activities || []).forEach((activity, activityIndex) => {
                        const wrap = document.createElement('div');
                        wrap.className = 'activity-detail';

                        const heading = document.createElement('h2');
                        heading.innerText = activity.title || '';
                        wrap.appendChild(heading);

                        const textDiv = document.createElement('div');
                        textDiv.className = 'activity-text';
                        textDiv.innerHTML = paragraphize(activity.desc);
                        wrap.appendChild(textDiv);

                        // 一個活動可以有多組照片集(albums)，每組各自可命名，也各自能點開全螢幕瀏覽
                        const albums = Array.isArray(activity.albums) ? activity.albums : [];
                        if (albums.length > 0) {
                            const previewWrap = document.createElement('div');
                            previewWrap.className = 'activity-gallery-preview';

                            albums.forEach(album => {
                                const photos = Array.isArray(album.photos) ? album.photos : [];
                                if (photos.length === 0) return; // 這組照片集沒有照片就跳過，不顯示空縮圖

                                // 用「目前已經有幾組照片集」當作這組的索引，燈箱靠這個索引找到對應照片
                                const galleryIndex = galleryData.length;
                                galleryData.push(photos);

                                const cover = document.createElement('div');
                                cover.className = 'gallery-cover';

                                const img = document.createElement('img');
                                img.src = resolveImagePath(photos[0].image);
                                img.alt = album.name || activity.title || '';
                                cover.appendChild(img);

                                const badge = document.createElement('div');
                                badge.className = 'gallery-count-badge';
                                // 有填「照片集名稱」就顯示名稱，取代預設的「共N張，點擊查看」
                                const hasName = album.name && album.name.trim() !== '';
                                badge.innerText = hasName
                                    ? album.name
                                    : (photos.length > 1 ? `📷 共 ${photos.length} 張，點擊查看` : '📷 點擊查看');
                                cover.appendChild(badge);

                                // 點擊封面縮圖，開啟全螢幕燈箱並從這組照片集的第一張開始瀏覽
                                cover.addEventListener('click', () => openGalleryLightbox(galleryIndex, 0));

                                previewWrap.appendChild(cover);
                            });

                            if (previewWrap.children.length > 0) {
                                wrap.appendChild(previewWrap);
                            }
                        }

                        container.appendChild(wrap);
                    });

                    hidePageLoadingOverlay();
                })
                .catch(error => {
                    document.getElementById('activities-container').innerHTML = '<div style="text-align:center; color:red;">活動紀事讀取失敗。</div>';
                    hidePageLoadingOverlay();
                });
        </script>

    </div>

</body>
</html>
