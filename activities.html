<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動介紹｜政大太極社</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS，與首頁共用同一套配色/字體設定，讓四個頁面視覺統一 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            // 關閉 preflight（Tailwind 的預設樣式重置），避免影響本頁原本手寫的 CSS
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        ink: { deep: '#08090A', dark: '#111315', card: '#181B1E' },
                        cloud: '#8E95A0',
                        pine: { light: '#427A5B', DEFAULT: '#1E3D2F', dark: '#0F2118' },
                        bronze: { light: '#D9C39E', DEFAULT: '#B89742', dark: '#8C6C30' }
                    },
                    fontFamily: { serif: ['Noto Serif TC', 'serif'] }
                }
            }
        }
    </script>

    <style>
        /* 全域 box-sizing 修正：Tailwind preflight 關閉後，少了這條關鍵重置，
           導致所有有 padding 的區塊實際寬度都會比容器多撐出 padding 的量，
           這正是手機版圖片/文字被切掉、出現橫向溢出的根本原因 */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        :root {
            --玄色: #121212; --霧霾灰: #A0A0A0; --松柏綠: #5C9A6C; --古銅金: #C5A059; --仙氣白: #E5E5E5;
        }
        html { overflow-x: hidden; max-width: 100%; }
        /* 圖片保護：子頁關閉了 preflight，少了瀏覽器預設會有的「圖片自動縮小配合容器寬度」規則，這裡補回來 */
        img {
            max-width: 100%;
            height: auto;
        }
        body { background-color: var(--玄色); color: var(--仙氣白); font-family: 'Noto Serif TC', serif; margin: 0; line-height: 1.8; overflow-x: hidden; }
        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        h1 { color: var(--古銅金); text-align: center; letter-spacing: 4px; font-size: 2.2rem; }
        .subtitle { text-align: center; color: var(--霧霾灰); font-style: italic; margin-bottom: 60px; font-size: 0.95rem; }

        .activity-detail {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(160, 160, 160, 0.15);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .activity-detail h2 {
            color: var(--松柏綠);
            background-color: rgba(160, 160, 160, 0.15);
            display: inline-block;
            padding: 10px 18px;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid var(--古銅金);
            border-right: 4px solid var(--古銅金);
        }

        .activity-text p {
            margin: 0 0 16px 0;
        }
        .activity-text p:last-child {
            margin-bottom: 0;
        }

        /* 歷年活動照片：小尺寸封面預覽（不管照片幾張，都只佔一個小方塊的版面）
           一個活動可以有多組照片集，用 flex 並排顯示，手機版會自動換行 */
        .activity-gallery-preview {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .gallery-cover {
            position: relative;
            width: 150px;
            height: 112px;
            border-radius: 10px;
            overflow: hidden;
            cursor: zoom-in;
            background: #1A1A1A;
            border: 1px solid rgba(160, 160, 160, 0.15);
        }
        .gallery-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .gallery-cover:hover img {
            transform: scale(1.06);
        }
        .gallery-count-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: var(--仙氣白);
            font-size: 0.7rem;
            padding: 20px 8px 6px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        /* 手機版縮圖再縮小一點，確保不佔用介紹欄位太多空間 */
        @media (max-width: 640px) {
            .gallery-cover {
                width: 110px;
                height: 82px;
            }
            .gallery-count-badge {
                font-size: 0.62rem;
                padding: 16px 4px 4px;
            }
        }

        /* 全螢幕相片集燈箱：點縮圖後開啟，可左右切換 */
        .gallery-lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .gallery-lightbox-overlay.active {
            display: flex;
        }
        .gallery-lightbox-img-wrap {
            max-width: 90vw;
            max-height: 85vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-lightbox-img-wrap img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: block;
        }
        .gallery-lightbox-close {
            position: absolute;
            top: 18px;
            right: 24px;
            color: var(--仙氣白);
            font-size: 2rem;
            line-height: 1;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1002;
        }
        .gallery-lightbox-counter {
            position: absolute;
            top: 22px;
            left: 26px;
            color: var(--霧霾灰);
            font-size: 0.8rem;
            letter-spacing: 1px;
            z-index: 1002;
        }
        .gallery-lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--仙氣白);
            font-size: 1.6rem;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1002;
            user-select: none;
        }
        .gallery-lightbox-arrow.prev { left: 14px; }
        .gallery-lightbox-arrow.next { right: 14px; }
        .gallery-lightbox-arrow:hover { background: rgba(255,255,255,0.2); }
        .gallery-lightbox-caption {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--古銅金);
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 0 60px;
        }
        @media (max-width: 640px) {
            .gallery-lightbox-arrow {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
            }
        }
        .gallery-empty-hint {
            color: var(--霧霾灰);
            font-size: 0.8rem;
            margin-top: 16px;
        }

        /* 手機版漢堡選單按鈕：因子頁關閉了 Tailwind 的 preflight，瀏覽器預設的按鈕框線/背景會跑出來，這裡手動重置 */
        #mobile-menu-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        /* 中英文切換按鈕：同樣因為關閉 preflight，瀏覽器預設的白底樣式會跑出來，這裡重置成透明底＋實線金色框，跟首頁一致 */
        #lang-toggle-desktop, #lang-toggle-mobile {
            background: none;
            border-style: solid;
            cursor: pointer;
            font-family: inherit; /* 按鈕預設不會繼承頁面字體，這裡強制套用跟首頁一樣的宋體 */
        }
    </style>
</head>
<body>

    <!-- 全站共用的語言切換邏輯，要在其他腳本之前載入 -->
    <script src="lang.js"></script>

    <!-- 整合版：頂部道門天際導覽（含手機版漢堡選單），與首頁共用同一套設計 -->
    <header class="sticky top-0 left-0 w-full z-50 bg-ink-deep/90 backdrop-blur-md border-b border-white/5 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center relative">

            <!-- 左側：道場牌匾 + 手機版語言切換鈕（一直顯示，不用點開漢堡選單） -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xl font-bold tracking-widest text-bronze-light flex items-center gap-2 transition-colors duration-300 hover:text-white no-underline">
                    <span id="nav-badge" class="text-xs border border-solid border-bronze px-1.5 py-0.5 rounded whitespace-nowrap">政大</span>
                    <span id="nav-brand" class="whitespace-nowrap">太極社</span> <span id="nav-brand-sub" class="hidden sm:inline font-light text-sm text-cloud/70 whitespace-nowrap">| 隱逸道場</span>
                </a>
                <button id="lang-toggle-mobile" type="button" class="md:hidden text-xs tracking-widest text-bronze-light border border-bronze/50 rounded px-2 py-1 hover:bg-bronze/10 transition-colors">EN</button>
            </div>

            <!-- 右側：電腦版跨頁導覽連結 -->
            <nav class="hidden md:flex gap-8 items-center">
                <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">首頁主殿</a>
                <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">法門深造</a>
                <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-bronze-light font-bold">活動介紹</a>
                <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">修煉日程</a>
                <a href="faq.html" class="nav-link-faq no-underline text-sm tracking-widest text-cloud/70 hover:text-bronze-light transition-colors duration-300">常見問題</a>
                <button id="lang-toggle-desktop" type="button" class="text-xs tracking-widest text-bronze-light border border-bronze/50 rounded px-2.5 py-1 hover:bg-bronze/10 transition-colors">EN</button>
            </nav>

            <!-- 右側：手機版漢堡選單按鈕 -->
            <button id="mobile-menu-btn" class="md:hidden text-bronze-light hover:text-white focus:outline-none transition-colors">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- 手機版下拉選單區塊 -->
        <nav id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-ink-deep/95 backdrop-blur-lg border-b border-white/10 flex-col items-center py-6 space-y-6 shadow-2xl transition-all duration-300 z-40">
            <a href="index.html" class="nav-link-home no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">首頁主殿</a>
            <a href="gongfa.html" class="nav-link-method no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">法門深造</a>
            <a href="activities.html" class="nav-link-activities no-underline text-sm tracking-widest text-bronze-light font-bold w-full text-center block">活動介紹</a>
            <a href="calendar.html" class="nav-link-calendar no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">修煉日程</a>
            <a href="faq.html" class="nav-link-faq no-underline text-sm tracking-widest text-cloud hover:text-bronze-light transition-colors w-full text-center block">常見問題</a>
        </nav>
    </header>

    <!-- 手機版選單開關腳本 + 語言切換按鈕初始化 -->
    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        });
        initLangSwitcher('lang-toggle-desktop');
        initLangSwitcher('lang-toggle-mobile');
    </script>


    <div class="container">
        <h1 id="page-title">活動點點滴滴</h1>
        <div class="subtitle" id="page-subtitle">「紀錄每一次揮灑汗水、交心暢談的珍貴時光。」</div>

        <!-- 動態活動載入區塊 -->
        <div id="activities-container">
            <div style="text-align:center; color:var(--霧霾灰);">正在翻閱活動紀事，載入中...</div>
        </div>

        <!-- 全螢幕相片集燈箱：所有活動共用同一組，開啟時依索引顯示對應的活動照片 -->
        <div id="gallery-lightbox-overlay" class="gallery-lightbox-overlay">
            <button id="gallery-lightbox-close" class="gallery-lightbox-close" aria-label="關閉">&times;</button>
            <div id="gallery-lightbox-counter" class="gallery-lightbox-counter"></div>
            <button id="gallery-lightbox-prev" class="gallery-lightbox-arrow prev" aria-label="上一張">&#10094;</button>
            <div id="gallery-lightbox-img-wrap" class="gallery-lightbox-img-wrap">
                <img id="gallery-lightbox-image" src="" alt="">
            </div>
            <button id="gallery-lightbox-next" class="gallery-lightbox-arrow next" aria-label="下一張">&#10095;</button>
            <div id="gallery-lightbox-caption" class="gallery-lightbox-caption"></div>
        </div>

        <!-- 串接後台資料的 JavaScript -->
        <script>
            function setText(id, value) {
                const el = document.getElementById(id);
                if (el && value !== undefined && value !== null) el.innerText = value;
            }
            function setTextAll(className, value) {
                if (value === undefined || value === null) return;
                document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
            }

            // 把後台填的「純文字」自動轉成一段一段的 <p>：空一行 = 分段；段落內單純換行 = 換行(<br>)
            function paragraphize(text) {
                if (!text) return '';
                return text
                    .split(/\n\s*\n/)
                    .map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`)
                    .join('');
            }

            // 圖片路徑防呆：本網站放在 .../Taichi-club-website/ 這個子路徑下，
            // 如果圖片路徑意外帶了開頭的 "/"，這裡統一拿掉，改成正確的相對路徑
            function resolveImagePath(path) {
                if (!path) return '';
                return path.replace(/^\/+/, '');
            }

            // ===== 全螢幕相片集燈箱邏輯 =====
            // galleryData 是攤平的照片集陣列：galleryData[N] = 第N組照片集的照片陣列 [{image, caption}, ...]
            // 一個活動可能對應好幾組照片集，所以不是用活動編號索引，而是用「渲染時遇到的順序」索引
            let galleryData = [];
            let currentGalleryIndex = 0;
            let currentPhotoIndex = 0;

            function renderLightboxPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                const photo = photos[currentPhotoIndex];
                const imgEl = document.getElementById('gallery-lightbox-image');
                imgEl.src = resolveImagePath(photo.image);
                imgEl.alt = photo.caption || '';
                document.getElementById('gallery-lightbox-caption').innerText = photo.caption || '';
                document.getElementById('gallery-lightbox-counter').innerText = `${currentPhotoIndex + 1} / ${photos.length}`;
            }
            function openGalleryLightbox(activityIndex, photoIndex) {
                currentGalleryIndex = activityIndex;
                currentPhotoIndex = photoIndex;
                renderLightboxPhoto();
                document.getElementById('gallery-lightbox-overlay').classList.add('active');
            }
            function closeGalleryLightbox() {
                document.getElementById('gallery-lightbox-overlay').classList.remove('active');
            }
            function showPrevPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
                renderLightboxPhoto();
            }
            function showNextPhoto() {
                const photos = galleryData[currentGalleryIndex] || [];
                if (photos.length === 0) return;
                currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
                renderLightboxPhoto();
            }

            document.getElementById('gallery-lightbox-close').addEventListener('click', closeGalleryLightbox);
            document.getElementById('gallery-lightbox-prev').addEventListener('click', showPrevPhoto);
            document.getElementById('gallery-lightbox-next').addEventListener('click', showNextPhoto);
            // 點背景（非圖片本身）也可以關閉
            document.getElementById('gallery-lightbox-overlay').addEventListener('click', (e) => {
                if (e.target.id === 'gallery-lightbox-overlay') closeGalleryLightbox();
            });
            // 鍵盤操作：左右鍵切換、Esc 關閉
            document.addEventListener('keydown', (e) => {
                const overlay = document.getElementById('gallery-lightbox-overlay');
                if (!overlay.classList.contains('active')) return;
                if (e.key === 'Escape') closeGalleryLightbox();
                if (e.key === 'ArrowLeft') showPrevPhoto();
                if (e.key === 'ArrowRight') showNextPhoto();
            });
            // 手機觸控滑動：左滑下一張、右滑上一張
            let touchStartX = 0;
            const lightboxImgWrap = document.getElementById('gallery-lightbox-img-wrap');
            lightboxImgWrap.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            lightboxImgWrap.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        showPrevPhoto();
                    } else {
                        showNextPhoto();
                    }
                }
            });

            // 導覽列文字與品牌角標：讀取 data/home.json 的 nav 設定，跟其他頁面共用同一份資料
            fetch('data/home.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容
                    if (!data.nav) return;
                    setText('nav-badge', data.nav.badge);
                    setText('nav-brand', data.nav.brand);
                    if (data.nav.brand_sub) setText('nav-brand-sub', '| ' + data.nav.brand_sub);
                    setTextAll('nav-link-home', data.nav.link_home);
                    setTextAll('nav-link-method', data.nav.link_method);
                    setTextAll('nav-link-activities', data.nav.link_activities);
                    setTextAll('nav-link-calendar', data.nav.link_calendar);
                    setTextAll('nav-link-faq', data.nav.link_faq);
                })
                .catch(error => console.error('讀取 data/home.json 失敗：', error));

            // 本頁主要內容：讀取 data/activities.json
            fetch('data/activities.json?v=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    data = applyLangToData(data); // 依目前語言整批轉換文字內容
                    if (data.page_title) {
                        document.getElementById('page-title').innerText = data.page_title;
                    }
                    if (data.page_subtitle) {
                        document.getElementById('page-subtitle').innerText = data.page_subtitle;
                    }

                    const container = document.getElementById('activities-container');
                    container.innerHTML = '';
                    galleryData = []; // 每次重新載入時清空，避免資料累加重複

                    (data.activities || []).forEach((activity, activityIndex) => {
                        const wrap = document.createElement('div');
                        wrap.className = 'activity-detail';

                        const heading = document.createElement('h2');
                        heading.innerText = activity.title || '';
                        wrap.appendChild(heading);

                        const textDiv = document.createElement('div');
                        textDiv.className = 'activity-text';
                        textDiv.innerHTML = paragraphize(activity.desc);
                        wrap.appendChild(textDiv);

                        // 一個活動可以有多組照片集(albums)，每組各自可命名，也各自能點開全螢幕瀏覽
                        const albums = Array.isArray(activity.albums) ? activity.albums : [];
                        if (albums.length > 0) {
                            const previewWrap = document.createElement('div');
                            previewWrap.className = 'activity-gallery-preview';

                            albums.forEach(album => {
                                const photos = Array.isArray(album.photos) ? album.photos : [];
                                if (photos.length === 0) return; // 這組照片集沒有照片就跳過，不顯示空縮圖

                                // 用「目前已經有幾組照片集」當作這組的索引，燈箱靠這個索引找到對應照片
                                const galleryIndex = galleryData.length;
                                galleryData.push(photos);

                                const cover = document.createElement('div');
                                cover.className = 'gallery-cover';

                                const img = document.createElement('img');
                                img.src = resolveImagePath(photos[0].image);
                                img.alt = album.name || activity.title || '';
                                cover.appendChild(img);

                                const badge = document.createElement('div');
                                badge.className = 'gallery-count-badge';
                                // 有填「照片集名稱」就顯示名稱，取代預設的「共N張，點擊查看」
                                const hasName = album.name && album.name.trim() !== '';
                                badge.innerText = hasName
                                    ? album.name
                                    : (photos.length > 1 ? `📷 共 ${photos.length} 張，點擊查看` : '📷 點擊查看');
                                cover.appendChild(badge);

                                // 點擊封面縮圖，開啟全螢幕燈箱並從這組照片集的第一張開始瀏覽
                                cover.addEventListener('click', () => openGalleryLightbox(galleryIndex, 0));

                                previewWrap.appendChild(cover);
                            });

                            if (previewWrap.children.length > 0) {
                                wrap.appendChild(previewWrap);
                            }
                        }

                        container.appendChild(wrap);
                    });
                })
                .catch(error => {
                    document.getElementById('activities-container').innerHTML = '<div style="text-align:center; color:red;">活動紀事讀取失敗。</div>';
                });
        </script>
