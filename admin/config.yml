backend:
  name: github
  repo: nccutaichiclub/Taichi-club-website
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "home_settings"
    label: "🏠 首頁主殿管理"
    files:
      - file: "data/home.json"
        label: "編輯首頁全部文字"
        name: "home"
        fields:
          - label: "頂部導覽列"
            name: "nav"
            widget: "object"
            fields:
              - { label: "角標文字 (如:政大)", name: "badge", widget: "string", hint: "建議 4 字以內，超過會擠到旁邊的社團名稱", pattern: ['^.{1,4}$', '請控制在 4 字以內'] }
              - { label: "角標文字 (English，選填，沒填會顯示中文版)", name: "badge_en", widget: "string", required: false }
              - { label: "社團名稱", name: "brand", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "社團名稱 (English，選填，沒填會顯示中文版)", name: "brand_en", widget: "string", required: false }
              - { label: "副標 (如:隱逸道場)", name: "brand_sub", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "副標 (English，選填，沒填會顯示中文版)", name: "brand_sub_en", widget: "string", required: false }
              - { label: "選單-首頁", name: "link_home", widget: "string", hint: "建議 6 字以內，避免手機版選單跑版", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-首頁 (English，選填，沒填會顯示中文版)", name: "link_home_en", widget: "string", required: false }
              - { label: "選單-法門深造", name: "link_method", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-法門深造 (English，選填，沒填會顯示中文版)", name: "link_method_en", widget: "string", required: false }
              - { label: "選單-活動介紹", name: "link_activities", widget: "string", hint: "建議 6 字以內，避免手機版選單跑版", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-活動介紹 (English，選填，沒填會顯示中文版)", name: "link_activities_en", widget: "string", required: false }
              - { label: "選單-修煉日程", name: "link_calendar", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-修煉日程 (English，選填，沒填會顯示中文版)", name: "link_calendar_en", widget: "string", required: false }
              - { label: "選單-常見問題", name: "link_faq", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-常見問題 (English，選填，沒填會顯示中文版)", name: "link_faq_en", widget: "string", required: false }
              - { label: "頁面載入提示文字 (顯示在網頁開啟時的過場畫面)", name: "loading_text", widget: "string", required: false, default: "道場開啟中...", hint: "建議 10 字以內。因為這段文字是在資料抓回來「之前」就要顯示的，改了之後不會馬上生效，要等訪客瀏覽過一次網站、瀏覽器記住新文字後，下一頁或下次造訪才會顯示新版本" }
              - { label: "頁面載入提示文字 (English，選填)", name: "loading_text_en", widget: "string", required: false, default: "Entering the Dojo..." }

          - label: "Hero 主視覺區"
            name: "hero"
            widget: "object"
            fields:
              - label: "電腦版輪播圖片 (建議使用橫式，寬 > 高，至少 1600px 寬)"
                name: "carousel_desktop"
                widget: "list"
                min: 1
                summary: "{{fields.alt}}"
                fields:
                  - { label: "圖片", name: "image", widget: "image", hint: "請上傳橫式(寬>高)的照片，避免電腦版寬螢幕顯示時被裁切過多" }
                  - { label: "圖片說明 (畫面上不會顯示，給搜尋引擎/視障讀者用)", name: "alt", widget: "string", required: false }
                  - { label: "圖片說明 (English，選填)", name: "alt_en", widget: "string", required: false }
              - label: "手機版輪播圖片 (建議使用直式，高 > 寬；若留空，手機版會自動沿用電腦版圖片)"
                name: "carousel_mobile"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                fields:
                  - { label: "圖片", name: "image", widget: "image", hint: "請上傳直式(高>寬)的照片，避免手機直式螢幕顯示時被裁切過多" }
                  - { label: "圖片說明 (畫面上不會顯示，給搜尋引擎/視障讀者用)", name: "alt", widget: "string", required: false }
                  - { label: "圖片說明 (English，選填)", name: "alt_en", widget: "string", required: false }

          - label: "四大法門 - 區塊標題"
            name: "methods_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "英文小標 (English，選填，沒填會顯示中文版)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內，一行內顯示完畢較美觀" }
              - { label: "區塊說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "string", required: false }

          - label: "四大法門 - 內容"
            name: "methods"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "法門代號 (勿隨意更改, 對應網頁程式碼)", name: "id", widget: "select", options: ["qigong", "taichi", "staff", "sword"] }
              - { label: "頁籤按鈕文字", name: "tab_label", widget: "string", hint: "建議 8 字以內，太長按鈕會被擠壓變形", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "頁籤按鈕文字 (English，選填，沒填會顯示中文版)", name: "tab_label_en", widget: "string", required: false }
              - { label: "小標籤 (如:內功心法．吐納歸真)", name: "tag", widget: "string", hint: "建議 14 字以內", pattern: ['^.{1,14}$', '請控制在 14 字以內'] }
              - { label: "小標籤 (English，選填，沒填會顯示中文版)", name: "tag_en", widget: "string", required: false }
              - { label: "法門標題", name: "title", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "法門標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "引言", name: "quote", widget: "string", hint: "建議 40 字以內，太長會佔用太多版面" }
              - { label: "引言 (English，選填，沒填會顯示中文版)", name: "quote_en", widget: "string", required: false }
              - { label: "詳細說明", name: "desc", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 120 字以內，超過會被自動截斷顯示；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "詳細說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - { label: "YouTube 影片網址 (選填)", name: "video_url", widget: "string", required: false, hint: "直接貼上完整的 YouTube 影片網址即可 (例如 https://www.youtube.com/watch?v=xxxxxxx)，留空則畫面顯示「演示影像預留區」提示" }
              - { label: "難度標示", name: "difficulty", widget: "string", hint: "建議 10 字以內，例如「修煉難度：入門」", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "難度標示 (English，選填，沒填會顯示中文版)", name: "difficulty_en", widget: "string", required: false }

          - label: "紅塵歷練 - 區塊標題"
            name: "experience_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "英文小標 (English，選填，沒填會顯示中文版)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }
              - { label: "區塊說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "string", required: false }

          - label: "紅塵歷練 - 卡片列表 (可自由新增/刪除/排序)"
            name: "experiences"
            widget: "list"
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: "編號 (壹/貳/參/肆...)", name: "roman", widget: "string", hint: "建議 1-2 字", pattern: ['^.{1,2}$', '請控制在 2 字以內'] }
              - { label: "編號 (English，選填，例如 I/II/III，沒填會顯示中文版)", name: "roman_en", widget: "string", required: false }
              - { label: "卡片標題", name: "title", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "卡片標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "卡片副標", name: "subtitle", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "卡片副標 (English，選填，沒填會顯示中文版)", name: "subtitle_en", widget: "string", required: false }
              - { label: "說明文字", name: "desc", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 90 字以內，超過會被自動截斷顯示，4 張卡片高度才能對齊；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "說明文字 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - { label: "卡片背景圖片 (選填)", name: "background_image", widget: "image", required: false, hint: "留空則維持原本的深色卡片背景；上傳後可用下面的透明度調整淡化程度" }
              - { label: "背景圖片透明度", name: "background_opacity", widget: "select", default: 20, options: [10, 20, 30, 40, 50, 60, 70], hint: "數字越小圖片越淡、文字越清楚好讀；數字越大圖片越明顯。建議先從 20 開始試" }

          - label: "道傳寰宇 - 區塊標題"
            name: "global_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "英文小標 (English，選填，沒填會顯示中文版)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }
              - { label: "區塊說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "string", required: false }

          - label: "道傳寰宇 - 內容"
            name: "global"
            widget: "object"
            fields:
              - { label: "副標文字 (如:外邦弟子的修真緣分)", name: "subtitle", widget: "string", hint: "建議 14 字以內", pattern: ['^.{1,14}$', '請控制在 14 字以內'] }
              - { label: "副標文字 (English，選填，沒填會顯示中文版)", name: "subtitle_en", widget: "string", required: false }
              - { label: "段落一", name: "para1", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 80 字以內；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "段落一 (English，選填，沒填會顯示中文版)", name: "para1_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - { label: "段落二", name: "para2", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 100 字以內；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "段落二 (English，選填，沒填會顯示中文版)", name: "para2_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - label: "國家標籤 (可自由新增/刪除/排序)"
                name: "country_tags"
                widget: "list"
                summary: "{{fields.code}} {{fields.name}}"
                fields:
                  - { label: "國碼 (如:JP)", name: "code", widget: "string", hint: "建議 2-3 個英文字母", pattern: ['^.{1,3}$', '請控制在 3 字以內'] }
                  - { label: "國家名稱 (如:日本)", name: "name", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
                  - { label: "國家名稱 (English，選填，沒填會顯示中文版)", name: "name_en", widget: "string", required: false }
                  - { label: "人數", name: "count", widget: "number", value_type: "int", min: 0 }
              - label: "統計數字 (建議 3 筆)"
                name: "stats"
                widget: "list"
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: "數字 (如:67+)", name: "number", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
                  - { label: "說明文字 (如:位國際同道)", name: "label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
                  - { label: "說明文字 (English，選填，沒填會顯示中文版)", name: "label_en", widget: "string", required: false }
              - label: "寰宇同道地圖 (貼上 Google My Maps 的嵌入連結)"
                name: "google_map_embed_url"
                widget: "string"
                required: false
                hint: "步驟：1) 到 Google My Maps (mymaps.google.com) 建立地圖並標記想要的地點 2) 點左上角選單「分享」→「在我的網站上嵌入」 3) 會出現一段 <iframe> 程式碼，把裡面 src=\"...\" 雙引號中的網址複製，只貼那段網址到這裡（不用貼整段 <iframe> 標籤）"

          - label: "師資介紹 - 區塊標題"
            name: "instructors_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "英文小標 (English，選填，沒填會顯示中文版)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }
              - { label: "區塊說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "string", required: false }

          - label: "師資介紹 - 老師列表 (寬版長條，一排一位)"
            name: "instructors"
            widget: "list"
            min: 1
            summary: "{{fields.name}}"
            fields:
              - { label: "照片 (選填)", name: "photo", widget: "image", required: false, hint: "建議使用方形或接近方形的大頭照，畫面會裁切成圓形顯示；留空則顯示姓名首字" }
              - { label: "姓名/稱謂", name: "name", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "姓名/稱謂 (English，選填，沒填會顯示中文版)", name: "name_en", widget: "string", required: false }
              - { label: "副標 (如:太極拳教練．十年教學經驗)", name: "subtitle", widget: "string", hint: "建議 20 字以內", pattern: ['^.{1,20}$', '請控制在 20 字以內'] }
              - { label: "副標 (English，選填，沒填會顯示中文版)", name: "subtitle_en", widget: "string", required: false }
              - { label: "簡介", name: "desc", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 60 字以內，超過會被自動截斷顯示；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "簡介 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }

          - label: "幹部介紹 - 區塊標題"
            name: "staff_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string" }
              - { label: "英文小標 (English，選填，沒填會顯示中文版)", name: "eyebrow_en", widget: "string", required: false }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }
              - { label: "區塊說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "string", required: false }

          - label: "幹部介紹 - 現任幹部列表 (電腦版兩人一排、手機版一人一排；簡介預設收合，需點「查看更多」展開)"
            name: "staff"
            widget: "list"
