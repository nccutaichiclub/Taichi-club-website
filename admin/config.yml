              - { label: "道場位置內容", name: "location_value", widget: "string", hint: "建議 30 字以內" }
              - { label: "道場位置內容 (English，選填，沒填會顯示中文版)", name: "location_value_en", widget: "string", required: false }
              - { label: "問道法郵標籤", name: "email_label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "問道法郵標籤 (English，選填，沒填會顯示中文版)", name: "email_label_en", widget: "string", required: false }
              - { label: "問道法郵內容", name: "email_value", widget: "string" }
              - { label: "仙界傳音標籤", name: "social_label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "仙界傳音標籤 (English，選填，沒填會顯示中文版)", name: "social_label_en", widget: "string", required: false }
              - { label: "仙界傳音內容", name: "social_value", widget: "string" }
              - { label: "仙界傳音內容 (English，選填，沒填會顯示中文版)", name: "social_value_en", widget: "string", required: false }
              - { label: "Facebook 粉專網址 (選填，填了才會顯示 FB 按鈕)", name: "fb_url", widget: "string", required: false, hint: "貼上完整網址，例如 https://www.facebook.com/nccutaichi" }
              - { label: "Instagram 帳號網址 (選填，填了才會顯示 IG 按鈕)", name: "ig_url", widget: "string", required: false, hint: "貼上完整網址，例如 https://www.instagram.com/nccu_taichi" }
