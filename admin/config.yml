              - { label: "活動詳細介紹 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - label: "照片集列表 (可自由新增/刪除/排序，一個活動可以放好幾組照片集，會並排顯示成好幾個小縮圖)"
