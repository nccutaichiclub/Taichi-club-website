              - { label: "頁尾小語 (English，選填，沒填會顯示中文版)", name: "footer_quote_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }

          - label: "每週修煉行事曆"
