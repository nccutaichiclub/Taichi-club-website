  - name: "calendar_settings"
    label: "📅 修煉行事曆管理"
    files:
      - file: "data/calendar.json"
        label: "編輯活動列表"
        name: "calendar"
        fields:
          - { label: "頁面主標題", name: "page_title", widget: "string", required: false, default: "四時曆法", hint: "建議 12 字以內" }
          - { label: "頁面主標題 (English，選填，沒填會顯示中文版)", name: "page_title_en", widget: "string", required: false }
          - { label: "頁面引言", name: "page_subtitle", widget: "string", required: false, default: "「順應天時，不期而遇。此乃本門弟子紅塵與山林修煉之引導。」", hint: "建議 50 字以內" }
          - { label: "頁面引言 (English，選填，沒填會顯示中文版)", name: "page_subtitle_en", widget: "string", required: false }
          - label: "本學期行事曆 (可上傳中/英文等多語言版本，並排顯示)"
            name: "semester_schedule"
            widget: "object"
            required: false
            fields:
              - { label: "區塊標題 (選填，顯示在圖片上方)", name: "title", widget: "string", required: false, default: "本學期行事曆", hint: "建議 16 字以內" }
              - { label: "區塊標題 (English，選填)", name: "title_en", widget: "string", required: false }
              - label: "行事曆版本列表 (可自由新增/刪除/排序，例如新增「中文版」「English」兩筆，會自動並排顯示)"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "版本名稱 (如:中文版 / English)", name: "label", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
                  - { label: "行事曆圖片", name: "display_image", widget: "image", hint: "建議使用直式或接近A4比例的圖片，會以小圖並排顯示，點擊可看全螢幕大圖" }
                  - { label: "下載檔案 (選填，如 PDF 版本)", name: "download_file", widget: "file", required: false, hint: "上傳後畫面上會出現一個下載按鈕，方便社員存檔或列印" }
                  - { label: "下載按鈕文字", name: "download_label", widget: "string", required: false, default: "下載行事曆", hint: "建議 12 字以內" }
                  - { label: "下載按鈕文字 (English，選填)", name: "download_label_en", widget: "string", required: false }
          - { label: "目前學期標題 (如:115-1)，一次只會有一個學期在使用，畫面上方會顯示成「115-1 學期行事曆」", name: "semester_title", widget: "string", hint: "換學期時只要改這一個欄位就好，不用逐筆活動修改", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
          - label: "行事曆活動列表"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "分類標題 (活動會依此歸類到對應的標題下)"
                name: "month"
                widget: "select"
                options: [
                  {label: "例行活動 (跨學期，如晨練、社課)", value: "recurring"},
                  {label: "上半學期活動 (期中前)", value: "first_half"},
                  {label: "下半學期活動 (期中後)", value: "second_half"}
                ]
              - {label: "日期文字 (顯示用)", name: "time", widget: "string", hint: "顯示在活動標題前面的日期文字，例如「10/18」或「每週三」"}
              - {label: "日期文字 (English，選填，沒填會顯示中文版)", name: "time_en", widget: "string", required: false}
              - {label: "活動類型 (如:常課/歷練，僅供內部參考，畫面上不會顯示)", name: "type", widget: "string", required: false}
              - {label: "活動標題", name: "title", widget: "string"}
              - { label: "活動標題 (English，選填，沒填會顯示中文版)", name: "title_en", widget: "string", required: false }
              - {label: "修煉據點 (選填)", name: "location", widget: "string", required: false}
              - { label: "修煉據點 (English，選填，沒填會顯示中文版)", name: "location_en", widget: "string", required: false }
              - {label: "詳細說明 (選填)", name: "desc", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "詳細說明 (English，選填，沒填會顯示中文版)", name: "desc_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
              - { label: "異動註記 (選填，如:停課、活動異動；會用醒目的暖紅色顯示在說明文字下方)", name: "note", widget: "string", required: false, hint: "建議 40 字以內，例如「因場地維修，本週暫停一次」" }
              - { label: "異動註記 (English，選填，沒填會顯示中文版)", name: "note_en", widget: "string", required: false }
              - { label: "起始日期 (選填，填了才會出現「加入日曆」按鈕)", name: "event_date", widget: "datetime", time_format: false, required: false, hint: "選這個活動最近一次(或第一次)舉行的日期" }
              - { label: "開始時間 (選填，24小時制，如 19:00)，會同時顯示在畫面上的活動時間", name: "start_time", widget: "string", required: false, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '請用 24 小時制格式，例如 19:00'] }
              - { label: "結束時間 (選填，24小時制，如 21:00)，會同時顯示在畫面上的活動時間", name: "end_time", widget: "string", required: false, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '請用 24 小時制格式，例如 21:00'] }
              - { label: "重複頻率 (選填)", name: "repeat", widget: "select", required: false, options: [{label: "不重複 (單次活動)", value: "none"}, {label: "每週重複", value: "weekly"}, {label: "隔週重複", value: "biweekly"}], default: "none" }
              - { label: "重複星期 (選填，一週要重複好幾天才需要選，例如晨練週一週三都有)", name: "repeat_days", widget: "select", multiple: true, required: false, options: [{label: "星期一", value: "MO"}, {label: "星期二", value: "TU"}, {label: "星期三", value: "WE"}, {label: "星期四", value: "TH"}, {label: "星期五", value: "FR"}, {label: "星期六", value: "SA"}, {label: "星期日", value: "SU"}], hint: "只有「重複頻率」設定為每週或隔週時才有作用；不選的話，就只會依照「起始日期」那天的星期重複" }
              - { label: "重複結束日期 (選填，只有「重複頻率」設定為每週或隔週時才有作用)", name: "repeat_until", widget: "datetime", time_format: false, required: false, hint: "設定後，加入 Google 日曆的重複活動只會重複到這一天為止，不會無限重複下去" }

  - name: "faq_settings"
    label: "❓ 常見問題頁管理"
    files:
      - file: "data/faq.json"
        label: "編輯常見問題內容"
        name: "faq"
        fields:
          - { label: "頁面主標題", name: "page_title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
          - { label: "頁面主標題 (English，選填，沒填會顯示中文版)", name: "page_title_en", widget: "string", required: false }
          - { label: "頁面引言 / 副標", name: "page_subtitle", widget: "string", hint: "建議 50 字以內" }
          - { label: "頁面引言 / 副標 (English，選填，沒填會顯示中文版)", name: "page_subtitle_en", widget: "string", required: false }
          - label: "常見問題分類 (可自由新增/刪除/拖曳排序；拖曳分類順序時，底下所有問題會整組跟著移動)"
            name: "categories"
            widget: "list"
            min: 1
            summary: "{{fields.category}}"
            fields:
              - { label: "分類名稱 (如:入門類、課程類、行政類)", name: "category", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "分類名稱 (English，選填，沒填會顯示中文版)", name: "category_en", widget: "string", required: false }
              - label: "這個分類底下的問題 (可自由新增/刪除/排序，點擊問題會展開答案)"
                name: "questions"
                widget: "list"
                min: 1
                summary: "{{fields.question}}"
                fields:
                  - { label: "問題", name: "question", widget: "string", hint: "建議 30 字以內" }
                  - { label: "問題 (English，選填，沒填會顯示中文版)", name: "question_en", widget: "string", required: false }
                  - { label: "答案", name: "answer", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 150 字以內。想加粗文字請前後加 **，例如 **重要**；想標成金色請前後加 [[ ]]，例如 [[重要]]；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
                  - { label: "答案 (English，選填，沒填會顯示中文版)", name: "answer_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }
