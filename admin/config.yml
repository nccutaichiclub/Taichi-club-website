backend:
  name: github
  repo: nccutaichiclub/Taichi-club-website
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "home_settings"
    label: "🏠 首頁主殿管理"
    files:
      - file: "data/home.json"
        label: "編輯首頁全部文字"
        name: "home"
        fields:
          - label: "頂部導覽列"
            name: "nav"
            widget: "object"
            fields:
              - { label: "角標文字 (如:政大)", name: "badge", widget: "string", hint: "建議 4 字以內，超過會擠到旁邊的社團名稱", pattern: ['^.{1,4}$', '請控制在 4 字以內'] }
              - { label: "社團名稱", name: "brand", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "副標 (如:隱逸道場)", name: "brand_sub", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "選單-首頁", name: "link_home", widget: "string", hint: "建議 6 字以內，避免手機版選單跑版", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-法門深造", name: "link_method", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-活動介紹", name: "link_activities", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
              - { label: "選單-修煉日程", name: "link_calendar", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }

          - label: "Hero 主視覺區"
            name: "hero"
            widget: "object"
            fields:
              - label: "電腦版輪播圖片 (建議使用橫式，寬 > 高，至少 1600px 寬)"
                name: "carousel_desktop"
                widget: "list"
                min: 1
                summary: "{{fields.alt}}"
                fields:
                  - { label: "圖片", name: "image", widget: "image", hint: "請上傳橫式(寬>高)的照片，避免電腦版寬螢幕顯示時被裁切過多" }
                  - { label: "圖片說明 (畫面上不會顯示，給搜尋引擎/視障讀者用)", name: "alt", widget: "string", required: false }
              - label: "手機版輪播圖片 (建議使用直式，高 > 寬；若留空，手機版會自動沿用電腦版圖片)"
                name: "carousel_mobile"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                fields:
                  - { label: "圖片", name: "image", widget: "image", hint: "請上傳直式(高>寬)的照片，避免手機直式螢幕顯示時被裁切過多" }
                  - { label: "圖片說明 (畫面上不會顯示，給搜尋引擎/視障讀者用)", name: "alt", widget: "string", required: false }

          - label: "四大法門 - 區塊標題"
            name: "methods_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內，一行內顯示完畢較美觀" }

          - label: "四大法門 - 內容"
            name: "methods"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "法門代號 (勿隨意更改, 對應網頁程式碼)", name: "id", widget: "select", options: ["qigong", "taichi", "staff", "sword"] }
              - { label: "頁籤按鈕文字", name: "tab_label", widget: "string", hint: "建議 8 字以內，太長按鈕會被擠壓變形", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "小標籤 (如:內功心法．吐納歸真)", name: "tag", widget: "string", hint: "建議 14 字以內", pattern: ['^.{1,14}$', '請控制在 14 字以內'] }
              - { label: "法門標題", name: "title", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "引言", name: "quote", widget: "string", hint: "建議 40 字以內，太長會佔用太多版面" }
              - { label: "詳細說明", name: "desc", widget: "text", hint: "建議 120 字以內，超過會被自動截斷顯示" }
              - { label: "難度標示", name: "difficulty", widget: "string", hint: "建議 10 字以內，例如「修煉難度：入門」", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }

          - label: "紅塵歷練 - 區塊標題"
            name: "experience_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }

          - label: "紅塵歷練 - 卡片列表 (可自由新增/刪除/排序)"
            name: "experiences"
            widget: "list"
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: "編號 (壹/貳/參/肆...)", name: "roman", widget: "string", hint: "建議 1-2 字", pattern: ['^.{1,2}$', '請控制在 2 字以內'] }
              - { label: "卡片標題", name: "title", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "卡片副標", name: "subtitle", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "說明文字", name: "desc", widget: "text", hint: "建議 90 字以內，超過會被自動截斷顯示，4 張卡片高度才能對齊" }
              - { label: "卡片背景圖片 (選填)", name: "background_image", widget: "image", required: false, hint: "留空則維持原本的深色卡片背景；上傳後可用下面的透明度調整淡化程度" }
              - { label: "背景圖片透明度", name: "background_opacity", widget: "select", default: 20, options: [10, 20, 30, 40, 50, 60, 70], hint: "數字越小圖片越淡、文字越清楚好讀；數字越大圖片越明顯。建議先從 20 開始試" }

          - label: "道傳寰宇 - 區塊標題"
            name: "global_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }

          - label: "道傳寰宇 - 內容"
            name: "global"
            widget: "object"
            fields:
              - { label: "副標文字 (如:外邦弟子的修真緣分)", name: "subtitle", widget: "string", hint: "建議 14 字以內", pattern: ['^.{1,14}$', '請控制在 14 字以內'] }
              - { label: "段落一", name: "para1", widget: "text", hint: "建議 80 字以內" }
              - { label: "段落二", name: "para2", widget: "text", hint: "建議 100 字以內" }
              - label: "國家標籤 (可自由新增/刪除/排序)"
                name: "country_tags"
                widget: "list"
                summary: "{{fields.code}} {{fields.name}}"
                fields:
                  - { label: "國碼 (如:JP)", name: "code", widget: "string", hint: "建議 2-3 個英文字母", pattern: ['^.{1,3}$', '請控制在 3 字以內'] }
                  - { label: "國家名稱 (如:日本)", name: "name", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
                  - { label: "人數", name: "count", widget: "number", value_type: "int", min: 0 }
              - label: "統計數字 (建議 3 筆)"
                name: "stats"
                widget: "list"
                summary: "{{fields.number}} {{fields.label}}"
                fields:
                  - { label: "數字 (如:67+)", name: "number", widget: "string", hint: "建議 6 字以內", pattern: ['^.{1,6}$', '請控制在 6 字以內'] }
                  - { label: "說明文字 (如:位國際同道)", name: "label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - label: "寰宇同道地圖點位 (可自由新增/刪除，這是示意圖不是真實地圖，用 0~100 的數字決定點位在圖上的位置)"
                name: "map_points"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "地點名稱 (如:指南山道場、法蘭西弟子)", name: "label", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
                  - { label: "水平位置 (0~100，數字越大越靠右)", name: "left_percent", widget: "number", value_type: "int", min: 0, max: 100, hint: "這是示意地圖不是真實經緯度，先填個數字看畫面效果，再慢慢微調即可" }
                  - { label: "垂直位置 (0~100，數字越大越靠下)", name: "top_percent", widget: "number", value_type: "int", min: 0, max: 100 }
                  - { label: "是否為本社道場位置 (會用較大的常駐標記顯示)", name: "highlight", widget: "boolean", default: false, required: false }

          - label: "師資介紹 - 區塊標題"
            name: "instructors_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }

          - label: "師資介紹 - 老師列表 (寬版長條，一排一位)"
            name: "instructors"
            widget: "list"
            min: 1
            summary: "{{fields.name}}"
            fields:
              - { label: "照片 (選填)", name: "photo", widget: "image", required: false, hint: "建議使用方形或接近方形的大頭照，畫面會裁切成圓形顯示；留空則顯示姓名首字" }
              - { label: "姓名/稱謂", name: "name", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "副標 (如:太極拳教練．十年教學經驗)", name: "subtitle", widget: "string", hint: "建議 20 字以內", pattern: ['^.{1,20}$', '請控制在 20 字以內'] }
              - { label: "簡介", name: "desc", widget: "text", hint: "建議 60 字以內，超過會被自動截斷顯示" }

          - label: "幹部介紹 - 區塊標題"
            name: "staff_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "區塊說明", name: "desc", widget: "string", hint: "建議 40 字以內" }

          - label: "幹部介紹 - 幹部列表 (寬版長條，跟師資介紹同樣式)"
            name: "staff"
            widget: "list"
            min: 1
            summary: "{{fields.name}} - {{fields.role}}"
            fields:
              - { label: "職稱 (顯示在姓名下方，如:社長)", name: "role", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "姓名", name: "name", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "照片 (選填)", name: "photo", widget: "image", required: false, hint: "留空則顯示姓名首字" }
              - { label: "簡介", name: "desc", widget: "text", hint: "建議 60 字以內，超過會被自動截斷顯示" }

          - label: "尋訪仙蹤 - 聯絡資訊"
            name: "contact_section"
            widget: "object"
            fields:
              - { label: "英文小標", name: "eyebrow", widget: "string", hint: "建議 20 字以內" }
              - { label: "區塊標題", name: "title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
              - { label: "簡介文字", name: "intro", widget: "text", hint: "建議 60 字以內" }

          - label: "尋訪仙蹤 - 詳細內容"
            name: "contact"
            widget: "object"
            fields:
              - { label: "道場位置標籤", name: "location_label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "道場位置內容", name: "location_value", widget: "string", hint: "建議 30 字以內" }
              - { label: "問道法郵標籤", name: "email_label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "問道法郵內容", name: "email_value", widget: "string" }
              - { label: "仙界傳音標籤", name: "social_label", widget: "string", hint: "建議 8 字以內", pattern: ['^.{1,8}$', '請控制在 8 字以內'] }
              - { label: "仙界傳音內容", name: "social_value", widget: "string" }
              - { label: "頁尾小語", name: "footer_quote", widget: "text", hint: "建議 60 字以內" }

          - label: "每週修煉行事曆"
            name: "schedule"
            widget: "object"
            fields:
              - { label: "表格標題", name: "title", widget: "string", hint: "建議 20 字以內" }
              - label: "課表列表"
                name: "rows"
                widget: "list"
                summary: "{{fields.time}} - {{fields.content}}"
                fields:
                  - { label: "修行時辰", name: "time", widget: "string", hint: "建議 14 字以內，太長表格會被壓縮" }
                  - { label: "修煉法門", name: "content", widget: "string", hint: "建議 20 字以內" }
                  - { label: "道場處所", name: "location", widget: "string", hint: "建議 16 字以內" }
              - { label: "道門提點文字", name: "note", widget: "text", hint: "建議 80 字以內" }

          - label: "頁尾"
            name: "footer"
            widget: "object"
            fields:
              - { label: "版權文字", name: "copyright", widget: "string", hint: "建議 60 字以內" }
              - { label: "小字標語", name: "sub", widget: "string", hint: "建議 30 字以內" }

  - name: "gongfa_settings"
    label: "🥋 法門深造頁管理"
    files:
      - file: "data/gongfa.json"
        label: "編輯法門深造內容"
        name: "gongfa"
        fields:
          - { label: "頁面主標題", name: "page_title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
          - { label: "頁面引言 / 副標", name: "page_subtitle", widget: "string", hint: "建議 50 字以內" }
          - label: "法門詳解列表 (可自由新增/刪除/排序)"
            name: "methods"
            widget: "list"
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: "法門標題", name: "title", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "詳細內容", name: "desc", widget: "text", hint: "直接打文字即可，不用輸入任何 HTML 標籤；段落之間空一行會自動分段" }
              - { label: "YouTube 影片網址 (選填)", name: "video_url", widget: "string", required: false, hint: "直接貼上完整的 YouTube 影片網址即可 (例如 https://www.youtube.com/watch?v=xxxxxxx)，留空則畫面顯示「準備中」提示" }

  - name: "activities_settings"
    label: "🎉 活動介紹頁管理"
    files:
      - file: "data/activities.json"
        label: "編輯活動介紹內容"
        name: "activities"
        fields:
          - { label: "頁面主標題", name: "page_title", widget: "string", hint: "建議 12 字以內", pattern: ['^.{1,12}$', '請控制在 12 字以內'] }
          - { label: "頁面引言 / 副標", name: "page_subtitle", widget: "string", hint: "建議 50 字以內" }
          - label: "活動列表 (可自由新增/刪除/排序)"
            name: "activities"
            widget: "list"
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: "活動標題", name: "title", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
              - { label: "活動詳細介紹", name: "desc", widget: "text", hint: "直接打文字即可，不用輸入任何 HTML 標籤；段落之間空一行會自動分段" }
              - label: "照片集列表 (可自由新增/刪除/排序，一個活動可以放好幾組照片集，會並排顯示成好幾個小縮圖)"
                name: "albums"
                widget: "list"
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { label: "照片集名稱 (選填)", name: "name", widget: "string", required: false, hint: "建議 12 字以內，例如「社課花絮」「幹部合照」；填了會取代畫面上預設的「共N張，點擊查看」文字，留空則顯示預設文字", pattern: ['^.{0,12}$', '請控制在 12 字以內'] }
                  - label: "這組照片集的照片 (可自由新增/刪除/排序)"
                    name: "photos"
                    widget: "list"
                    fields:
                      - { label: "照片", name: "image", widget: "image" }
                      - { label: "照片說明 (選填，如:2025年秋季社遊)", name: "caption", widget: "string", required: false, hint: "建議 20 字以內" }

  - name: "calendar_settings"
    label: "📅 修煉行事曆管理"
    files:
      - file: "data/calendar.json"
        label: "編輯活動列表"
        name: "calendar"
        fields:
          - label: "本學期行事曆 (可上傳中/英文等多語言版本，並排顯示)"
            name: "semester_schedule"
            widget: "object"
            required: false
            fields:
              - { label: "區塊標題 (選填，顯示在圖片上方)", name: "title", widget: "string", required: false, default: "本學期行事曆", hint: "建議 16 字以內" }
              - label: "行事曆版本列表 (可自由新增/刪除/排序，例如新增「中文版」「English」兩筆，會自動並排顯示)"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "版本名稱 (如:中文版 / English)", name: "label", widget: "string", hint: "建議 10 字以內", pattern: ['^.{1,10}$', '請控制在 10 字以內'] }
                  - { label: "行事曆圖片", name: "display_image", widget: "image", hint: "建議使用直式或接近A4比例的圖片，會以小圖並排顯示，點擊可看全螢幕大圖" }
                  - { label: "下載檔案 (選填，如 PDF 版本)", name: "download_file", widget: "file", required: false, hint: "上傳後畫面上會出現一個下載按鈕，方便社員存檔或列印" }
                  - { label: "下載按鈕文字", name: "download_label", widget: "string", required: false, default: "下載行事曆", hint: "建議 12 字以內" }
          - label: "行事曆活動列表"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "時節 / 週期 (顯示用文字)", name: "time", widget: "string", hint: "畫面上顯示的文字，例如「每週二 19:00 - 21:00」"}
              - {label: "活動類型 (如:常課/歷練)", name: "type", widget: "string"}
              - {label: "活動標題", name: "title", widget: "string"}
              - {label: "詳細說明", name: "desc", widget: "text"}
              - {label: "修煉據點", name: "location", widget: "string"}
              - { label: "起始日期 (選填，填了才會出現「加入日曆」按鈕)", name: "event_date", widget: "datetime", time_format: false, required: false, hint: "選這個活動最近一次(或第一次)舉行的日期" }
              - { label: "開始時間 (選填，24小時制，如 19:00)", name: "start_time", widget: "string", required: false, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '請用 24 小時制格式，例如 19:00'] }
              - { label: "結束時間 (選填，24小時制，如 21:00)", name: "end_time", widget: "string", required: false, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', '請用 24 小時制格式，例如 21:00'] }
              - { label: "重複頻率 (選填)", name: "repeat", widget: "select", required: false, options: [{label: "不重複 (單次活動)", value: "none"}, {label: "每週重複", value: "weekly"}, {label: "隔週重複", value: "biweekly"}], default: "none" }
