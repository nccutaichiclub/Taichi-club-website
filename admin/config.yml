                  - { label: "修煉法門 (English，選填，沒填會顯示中文版)", name: "content_en", widget: "string", required: false }
                  - { label: "道場處所", name: "location", widget: "string", hint: "建議 16 字以內" }
                  - { label: "道場處所 (English，選填，沒填會顯示中文版)", name: "location_en", widget: "string", required: false }
              - { label: "提點標籤文字 (顯示在提點文字前面，如「道門提點：」)", name: "note_label", widget: "string", required: false, default: "道門提點：", hint: "建議 10 字以內" }
              - { label: "提點標籤文字 (English，選填)", name: "note_label_en", widget: "string", required: false }
              - { label: "道門提點文字", name: "note", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, hint: "建議 80 字以內；工具列的 Bold 按鈕＝粗體；Code 按鈕(反引號圖示)＝金色標註；Strikethrough 按鈕(刪除線圖示)＝綠色標註" }
              - { label: "道門提點文字 (English，選填，沒填會顯示中文版)", name: "note_en", widget: "markdown", buttons: ["bold", "code", "strikethrough"], minimal: true, required: false, hint: "同樣可用 Bold／Code／Strikethrough 按鈕排版" }

          - label: "頁尾"
            name: "footer"
            widget: "object"
            fields:
              - { label: "版權文字", name: "copyright", widget: "string", hint: "建議 60 字以內" }
              - { label: "版權文字 (English，選填，沒填會顯示中文版)", name: "copyright_en", widget: "string", required: false }
              - { label: "小字標語", name: "sub", widget: "string", hint: "建議 30 字以內" }
              - { label: "小字標語 (English，選填，沒填會顯示中文版)", name: "sub_en", widget: "string", required: false }

